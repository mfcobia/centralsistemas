<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Painel de Indicadores M&amp;F</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: barra lateral verde-escura com o logo e as planilhas por área + área principal creme com filtros, grade de indicadores e editor sobreposto. Identidade: guia de marca M&F 2024 */
:root{
  --bg:#EFEADD; --surface:#FBF9F4; --surface-2:#F4F0E6; --ink:#033838; --muted:#5A6262; --line:#E0D9C8; --line-2:#CDC5B0;
  --accent:#1A934D; --btn:#09533E; --btn-ink:#FFFFFF; --accent-soft:#DFEBCB; --accent-soft-ink:#09533E;
  --amber:#E09A0B; --amber-soft:#FBE7BD; --amber-ink:#7A5300;
  --side:#033838; --side-2:#0A4747; --side-fg:#EFEADD; --side-muted:#9DB8B2; --lime:#A3C642;
  --good:#1A7F43; --warn:#A06800; --bad:#C23A3A;
  --c1:#1A934D; --c2:#015655; --c3:#A3C642; --c4:#479ED6; --c5:#F7B021; --c6:#ED6926;
  --shadow:0 18px 50px rgba(3,56,56,.2);
  --f-body:'Raleway',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Roboto',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'Roboto',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#021E1E; --surface:#062A2A; --surface-2:#0A3333; --ink:#EFEADD; --muted:#A7B9B4; --line:#123E3E; --line-2:#1C4B4B;
  --accent:#A3C642; --btn:#A3C642; --btn-ink:#033838; --accent-soft:#163F37; --accent-soft-ink:#CFFF8C;
  --amber:#F7B021; --amber-soft:#3A2C0C; --amber-ink:#F9D37A;
  --side:#011515; --side-2:#0A3333; --side-fg:#EFEADD; --side-muted:#8FAAA4; --lime:#A3C642;
  --good:#6CCB8C; --warn:#F7B021; --bad:#FF7F7F;
  --c1:#A3C642; --c2:#3FB6A8; --c3:#479ED6; --c4:#F7B021; --c5:#ED6926; --c6:#FF668D;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#021E1E; --surface:#062A2A; --surface-2:#0A3333; --ink:#EFEADD; --muted:#A7B9B4; --line:#123E3E; --line-2:#1C4B4B;
  --accent:#A3C642; --btn:#A3C642; --btn-ink:#033838; --accent-soft:#163F37; --accent-soft-ink:#CFFF8C;
  --amber:#F7B021; --amber-soft:#3A2C0C; --amber-ink:#F9D37A;
  --side:#011515; --side-2:#0A3333; --side-fg:#EFEADD; --side-muted:#8FAAA4; --lime:#A3C642;
  --good:#6CCB8C; --warn:#F7B021; --bad:#FF7F7F;
  --c1:#A3C642; --c2:#3FB6A8; --c3:#479ED6; --c4:#F7B021; --c5:#ED6926; --c6:#FF668D;
  --shadow:0 18px 50px rgba(0,0,0,.55); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:flex;flex-wrap:wrap;min-height:100vh}

/* sidebar */
.side{flex:1 1 240px;max-width:270px;background:var(--side);color:var(--side-fg);padding:24px 16px;display:flex;flex-direction:column;gap:26px}
.brand{display:flex;flex-direction:column;gap:12px;padding:4px 6px 18px;border-bottom:1px solid var(--side-2)}
.brand img{width:100%;max-width:210px;height:auto;display:block}
.brand-sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);font-weight:700}
.side h2{margin:0;font-family:var(--f-head);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);font-weight:600}
.src-list{display:flex;flex-direction:column;gap:4px}
.src{display:flex;align-items:center;gap:6px;border-radius:8px}
.src.on{background:var(--side-2)}
.src-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:none;border:0;color:var(--side-fg);padding:9px 10px;text-align:left;cursor:pointer;border-radius:8px}
.src-btn:hover{background:var(--side-2)}
.src-btn .n{font-size:13px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-btn .m{font-size:11px;color:var(--side-muted)}
.src-x{background:none;border:0;color:var(--side-muted);width:32px;height:32px;border-radius:6px;cursor:pointer;flex:none}
.src-x:hover{color:#fff;background:var(--side-2)}
.src-x.confirm{width:auto;padding:0 8px;color:#fff;background:#C23A3A;font-size:11px}
.tag{font-size:9.5px;letter-spacing:.06em;padding:1px 6px;border-radius:99px;background:var(--lime);color:#033838;font-weight:700;margin-left:4px;vertical-align:1px}
.up-btn{min-height:44px;border:1px dashed #2F6B64;font-weight:600;background:transparent;color:var(--side-fg);border-radius:9px;cursor:pointer;font-size:13px;width:100%}
.up-btn:hover{border-color:var(--side-fg)}
.side-note{font-size:12px;color:var(--side-muted);line-height:1.5}

/* main */
.main{flex:999 1 560px;min-width:0;padding-block:26px 48px;padding-inline:clamp(16px,3vw,34px);display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.top .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-soft-ink);font-weight:700}
.top h1{margin:6px 0 0;font-family:var(--f-head);font-weight:700;text-transform:uppercase;font-size:clamp(24px,3vw,32px);letter-spacing:.03em;line-height:1.1;text-wrap:balance}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px;border-radius:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.08em;font-size:12.5px;background:none;border:0;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.ctl{min-height:40px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;font-size:14px;color:var(--ink);font-weight:400;min-width:0;width:100%}
textarea.ctl{padding:10px 12px;min-height:72px;resize:vertical;font-family:var(--f-num);font-size:13.5px;line-height:1.5;background:var(--surface-2)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.wide{grid-column:span 2}
@media (max-width:720px){.card.wide{grid-column:span 1}}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-h h3{margin:0;font-family:var(--f-head);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card-h .sub{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
.card-acts{display:flex;gap:2px;flex:none}
.ic{width:34px;height:34px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.ic:hover{background:var(--surface-2);color:var(--ink)}
.ic.confirm{width:auto;padding:0 8px;background:var(--bad);color:#fff;font-size:12px;font-weight:600}
.ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.kpi-v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:clamp(26px,3vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi-s{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.up{color:var(--good);font-weight:600}.down{color:var(--bad);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chart-box{position:relative;height:230px}
.chart-box.spark{height:54px}
.err{font-size:13px;color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent);border-radius:8px;padding:10px 12px}
.tbl-wrap{overflow:auto;max-height:280px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);z-index:1}
td.r,th.r{text-align:right}
.empty{border:1.5px dashed var(--line-2);border-radius:14px;padding:36px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font-size:16px}

/* data view */
.data-meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-soft-ink);border:0;cursor:pointer;font-weight:500}
.chip.d{background:var(--amber-soft);color:var(--amber-ink)}
.chip.t{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.chip.fn{font-family:var(--f-num);font-size:11.5px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.data-tbl{max-height:62vh}
.data-tbl th select{border:1px solid var(--line-2);border-radius:6px;background:var(--surface);font-size:11px;padding:2px 4px;margin-top:4px;display:block}

/* editor */
.overlay{position:fixed;inset:0;background:rgba(10,16,21,.48);z-index:50;display:flex;justify-content:flex-end;padding-top:env(safe-area-inset-top,0px)}
.panel{background:var(--bg);width:min(1060px,100%);height:100%;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.panel-h{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-head);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.panel-b{display:flex;flex-wrap:wrap;gap:20px;padding:20px}
.form{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px}
.preview{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:10px}
.preview .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.preview-sticky{position:sticky;top:76px;display:flex;flex-direction:column;gap:10px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.box h4{margin:0;font-family:var(--f-head);font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent-soft-ink)}
.help{font-size:12px;color:var(--muted);line-height:1.55}
.help code{font-family:var(--f-num);font-size:11.5px;background:var(--surface-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.frow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1.2fr) 36px;gap:6px;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);font-weight:500;min-height:40px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.drop{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--accent) 22%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink)}
.area-h{font-family:var(--f-head);font-size:11px;color:var(--lime);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:10px 0 2px 10px}
.area-h:first-child{margin-top:0}
.link-btn{background:none;border:0;color:var(--side-muted);font-family:inherit;text-decoration:underline;cursor:pointer;font-size:12px;padding:6px 0;text-align:left}
.link-btn:hover{color:var(--side-fg)}
.funnel{display:flex;flex-direction:column;gap:10px}
.fstep{display:flex;flex-direction:column;gap:4px}
.fl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.fl b{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.fbar{height:22px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fbar>i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.fconv{font-size:11.5px;color:var(--muted)}
.warn-btn{background:var(--bad)!important;border-color:var(--bad)!important;color:#fff!important}
.hl{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.hl-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hl-h h2{margin:0;font-family:var(--f-head);font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent-soft-ink)}
.hl ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:8px 22px}
.hl li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;line-height:1.5;min-width:0}
.hl li i{font-style:normal;font-size:11px;flex:none;width:16px;text-align:center}
.hl li.good i{color:var(--good)}.hl li.bad i{color:var(--bad)}.hl li.neutral i{color:var(--muted)}
.hl b{font-family:var(--f-num);font-weight:700}
@media (max-width:640px){.side{max-width:none;flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const ICON={
  edit:'<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  del:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>'
};
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}

function num(v){
  if(typeof v==='number')return isFinite(v)?v:null;
  if(v==null)return null;
  let s=String(v).trim();if(!s)return null;
  s=s.replace(/R\$|\s|%| /g,'');
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)||/^-?\d+,\d+$/.test(s))s=s.replace(/\./g,'').replace(',','.');
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,'');
  if(!/^-?\d*\.?\d+(e-?\d+)?$/i.test(s))return null;
  const n=Number(s);return isFinite(n)?n:null;
}
function toDate(v){
  if(v instanceof Date)return isNaN(v)?null:v;
  if(typeof v!=='string')return null;
  const s=v.trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?null:d}
  return null;
}
const pad=n=>String(n).padStart(2,'0');
const isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const empty=v=>v===''||v==null;

/* ============ estado ============ */
const KEY='mf-indicadores-v1';
const S={sources:[],active:null,indicators:[],gf:{},tab:'dash'};
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));$('#sideNote').dataset.full='1'}
  catch(e){
    try{localStorage.setItem(KEY,JSON.stringify({...S,sources:S.sources.map(s=>({...s,rows:[],missing:true}))}))}catch(e2){}
  }
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(!raw)return false;const o=JSON.parse(raw);if(!o||!Array.isArray(o.sources))return false;Object.assign(S,o);S.tab='dash';return true}catch(e){return false}
}
const src=id=>S.sources.find(s=>s.id===id);
const activeSrc=()=>src(S.active);

/* ============ leitura de planilhas ============ */
function detectType(rows,col){
  let n=0,d=0,k=0;
  for(const r of rows){const v=r[col];if(empty(v))continue;k++;if(toDate(v))d++;else if(num(v)!=null)n++;if(k>=400)break}
  if(!k)return 'texto';
  if(d/k>=.8)return 'data';
  if(n/k>=.8)return 'numero';
  return 'texto';
}
function buildSource(name,sheet,rows){
  rows=rows.map(r=>{const o={};for(const k in r){let v=r[k];if(v instanceof Date){const d=new Date(v.getTime()+3600e3*2);v=isoDay(d)}else if(typeof v==='string')v=v.trim();o[String(k).trim()]=v}return o})
           .filter(r=>Object.values(r).some(v=>!empty(v)));
  const cols=[];for(const r of rows.slice(0,50))for(const k in r)if(!cols.includes(k)&&!/^__EMPTY/.test(k))cols.push(k);
  return {id:uid(),name,sheet,rows,columns:cols.map(c=>({name:c,type:detectType(rows,c)})),at:Date.now()};
}
async function readFiles(files){
  let added=0,updated=0,recalc=0,last=null;const msgs=[];
  for(const f of files){
    try{
      const buf=await f.arrayBuffer();
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      for(const sh of wb.SheetNames){
        const rows=readSheet(wb.Sheets[sh]);
        if(!rows.length)continue;
        const fresh=buildSource(f.name,wb.SheetNames.length>1?sh:'',rows);fresh.area=(activeSrc()&&activeSrc().area)||'geral';
        const old=S.sources.find(s=>s.name===fresh.name&&s.sheet===fresh.sheet);
        if(old){
          const keepTypes=Object.fromEntries(old.columns.map(c=>[c.name,c.type]));
          old.rows=fresh.rows;old.columns=fresh.columns.map(c=>({...c,type:keepTypes[c.name]||c.type}));old.at=Date.now();old.missing=false;old.sample=false;
          updated++;recalc+=S.indicators.filter(i=>i.sourceId===old.id).length;last=old.id;
          if(!S.indicators.some(i=>i.sourceId===old.id)){const r=fillSource(old);if(r.n)msgs.push(r)}
        }else{S.sources.push(fresh);added++;last=fresh.id;msgs.push(fillSource(fresh))}
      }
    }catch(e){toast(`Não consegui ler ${f.name}. Confira se é .xlsx ou .csv.`)}
  }
  if(last){S.active=last;S.tab='dash';save();renderAll();
    const m=msgs[msgs.length-1];
    toast(m&&m.from?`Painel montado com os ${m.n} indicadores de ${m.from.replace(/\.[^.]+$/,'')}`:m&&m.n?`Painel montado automaticamente com ${m.n} indicadores`:updated?`Dados atualizados · ${recalc} indicador(es) recalculado(s)`:`Planilha carregada. Não reconheci colunas numéricas: crie os indicadores em + Novo indicador.`)}
}

/* ============ motor de cálculo ============ */
const AGG={soma:'Soma',media:'Média',contar:'Contagem',distintos:'Contagem distinta',min:'Mínimo',max:'Máximo',mediana:'Mediana'};
function aggregate(rows,agg,col){
  if(agg==='contar')return col?rows.filter(r=>!empty(r[col])).length:rows.length;
  if(agg==='distintos')return new Set(rows.map(r=>r[col]).filter(v=>!empty(v))).size;
  const xs=[];for(const r of rows){const v=num(r[col]);if(v!=null)xs.push(v)}
  if(!xs.length)return null;
  if(agg==='soma')return xs.reduce((a,b)=>a+b,0);
  if(agg==='media')return xs.reduce((a,b)=>a+b,0)/xs.length;
  if(agg==='min')return Math.min(...xs);
  if(agg==='max')return Math.max(...xs);
  if(agg==='mediana'){xs.sort((a,b)=>a-b);const m=xs.length>>1;return xs.length%2?xs[m]:(xs[m-1]+xs[m])/2}
  return null;
}
function match(v,op,t,type){
  if(op==='vazio')return empty(v);
  if(op==='naovazio')return !empty(v);
  if(op==='contem')return String(v??'').toLowerCase().includes(String(t??'').toLowerCase());
  let a,b;
  if(type==='data'){const x=toDate(v),y=toDate(t);a=x&&x.getTime();b=y&&y.getTime()}
  else if(type==='numero'){a=num(v);b=num(t)}
  if(a==null||b==null){a=String(v??'').trim().toLowerCase();b=String(t??'').trim().toLowerCase()}
  switch(op){case '=':return a===b;case '!=':return a!==b;case '>':return a>b;case '>=':return a>=b;case '<':return a<b;case '<=':return a<=b}
  return true;
}
const FN={SOMA:'soma',MEDIA:'media',CONTAR:'contar',CONTAR_DISTINTO:'distintos',MIN:'min',MAX:'max',MEDIANA:'mediana'};
const norm=s=>s.toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function findCol(s,raw){
  const n=String(raw??'').trim().replace(/^\[|\]$/g,'').replace(/^"|"$/g,'').trim();
  const c=s.columns.find(c=>c.name.toLowerCase()===n.toLowerCase());
  if(!c)throw new Error(`Coluna "${n}" não existe nesta planilha.`);
  return c;
}
function splitArgs(s){
  const sep=s.includes(';')?';':',';const out=[];let cur='',q=false;
  for(const ch of s){if(ch==='"'){q=!q;cur+=ch;continue}if(ch===sep&&!q){out.push(cur.trim());cur='';continue}cur+=ch}
  if(cur.trim()!==''||out.length)out.push(cur.trim());return out;
}
function condFn(s,colRaw,valRaw){
  if(valRaw==null)throw new Error('Faltou o valor da condição. Ex.: CONTAR_SE(Status; "Acordo")');
  const c=findCol(s,colRaw);let v=valRaw.replace(/^"|"$/g,'');let op='=',t=v;
  const m=v.match(/^(>=|<=|<>|!=|>|<|=)(.*)$/);if(m){op=m[1]==='<>'?'!=':m[1];t=m[2].trim()}
  return r=>match(r[c.name],op,t,c.type);
}
function evalFormula(rows,f,s){
  if(!f||!f.trim())throw new Error('Escreva uma fórmula. Ex.: SOMA(Valor) / CONTAR(Contrato)');
  let expr=f,g=0;const re=/([A-Za-zÀ-ú_]+)\s*\(([^()]*)\)/;
  while(re.test(expr)){
    if(g++>300)throw new Error('Fórmula longa demais.');
    expr=expr.replace(re,(all,fn,args)=>{
      const F=norm(fn),a=splitArgs(args);let v;
      if(F==='LINHAS')v=rows.length;
      else if(F==='CONTAR_SE')v=rows.filter(condFn(s,a[0],a[1])).length;
      else if(F==='SOMA_SE'||F==='MEDIA_SE'){const c=findCol(s,a[0]);v=aggregate(rows.filter(condFn(s,a[1],a[2])),F==='SOMA_SE'?'soma':'media',c.name)}
      else if(FN[F]){const c=a[0]?findCol(s,a[0]):null;if(!c&&F!=='CONTAR')throw new Error(`${fn}() precisa de uma coluna.`);v=aggregate(rows,FN[F],c&&c.name)}
      else throw new Error(`Função "${fn}" não reconhecida.`);
      return v==null?'(0/0)':`(${v})`;
    });
  }
  const clean=expr.replace(/\s+/g,'').replace(/(\d),(\d)/g,'$1.$2');
  if(!/^[\d.+\-*/()e]*$/.test(clean))throw new Error('Use as colunas dentro de funções, ex.: SOMA(Valor). Texto solto não é permitido.');
  let val;try{val=Function(`"use strict";return (${clean});`)()}catch(e){throw new Error('Confira parênteses e operadores da fórmula.')}
  return typeof val==='number'&&isFinite(val)?val:null;
}
function dateKey(d,gr){
  if(!d)return null;
  if(gr==='dia')return isoDay(d);
  if(gr==='semana'){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);return isoDay(x)}
  if(gr==='trimestre')return `${d.getFullYear()}-T${Math.floor(d.getMonth()/3)+1}`;
  if(gr==='ano')return String(d.getFullYear());
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
}
function dateLabel(k,gr){
  if(k==null)return '(sem data)';
  const y=k.slice(2,4);
  if(gr==='dia'){const[, m,d]=k.split('-');return `${d}/${m}/${y}`}
  if(gr==='semana'){const[, m,d]=k.split('-');return `sem ${d}/${m}`}
  if(gr==='trimestre')return `${k.slice(-1)}º tri/${y}`;
  if(gr==='ano')return k;
  return `${MES[+k.slice(5,7)-1]}/${y}`;
}
function baseRows(ind){
  const s=src(ind.sourceId);if(!s)throw new Error('A planilha deste indicador foi removida.');
  let rows=s.rows;
  for(const f of ind.filters||[]){if(!f.col)continue;const c=s.columns.find(c=>c.name===f.col);if(c)rows=rows.filter(r=>match(r[c.name],f.op,f.val,c.type))}
  const gf=S.gf[s.id];
  if(gf){
    if(gf.col&&gf.val!=null&&gf.val!==''){rows=rows.filter(r=>String(r[gf.col]??'').trim()===gf.val)}
    if(gf.dcol&&(gf.from||gf.to)){const a=gf.from?toDate(gf.from):null,b=gf.to?toDate(gf.to):null;rows=rows.filter(r=>{const d=toDate(r[gf.dcol]);if(!d)return false;return(!a||d>=a)&&(!b||d<=b)})}
  }

}
const valueOf=(ind,rows,s)=>ind.mode==='formula'?evalFormula(rows,ind.formula,s):aggregate(rows,ind.agg,ind.col||'');
function compute(ind){
  const{s,rows}=baseRows(ind);
  if(ind.mode==='etapas'){
    const steps=(ind.steps||[]).map(n=>s.columns.find(c=>c.name===n)).filter(Boolean);
    if(steps.length<2)throw new Error('Escolha pelo menos duas etapas para o funil.');
    const groups=steps.map(c=>({key:c.name,label:c.name,rows,value:aggregate(rows,'soma',c.name)}));
    return{total:groups[groups.length-1].value,groups,isDate:false,n:rows.length};
  }
  if(!s.rows.length&&s.missing)throw new Error('Reenvie o arquivo desta planilha para ver os dados (ele era grande demais para ficar salvo no navegador).');
  const total=valueOf(ind,rows,s);let groups=null,isDate=false;
  if(ind.groupBy){
    const c=s.columns.find(c=>c.name===ind.groupBy);
    if(!c)throw new Error(`A coluna "${ind.groupBy}" não existe mais na planilha.`);
    isDate=c.type==='data';const map=new Map();
    for(const r of rows){let k=isDate?dateKey(toDate(r[c.name]),ind.gran||'mes'):(String(r[c.name]??'').trim()||'(vazio)');if(!map.has(k))map.set(k,[]);map.get(k).push(r)}
    groups=[...map].map(([k,rs])=>({key:k,label:isDate?dateLabel(k,ind.gran||'mes'):k,rows:rs,value:valueOf(ind,rs,s)}));
    if(isDate)groups.sort((a,b)=>a.key==null?1:b.key==null?-1:a.key<b.key?-1:1);
    else{groups.sort((a,b)=>(b.value??-Infinity)-(a.value??-Infinity));
      const lim=+ind.limit||0;
      if(lim&&groups.length>lim){const rest=groups.slice(lim-1);const rr=rest.flatMap(g=>g.rows);groups=groups.slice(0,lim-1);groups.push({key:'__outros',label:`Outros (${rest.length})`,rows:rr,value:valueOf(ind,rr,s)})}}
  }
  return{total,groups,isDate,n:rows.length};
}

/* ============ formatação ============ */
function fmt(v,ind,compact){
  if(v==null||!isFinite(v))return '—';
  const f=ind.format||'num';let dec=ind.decimals;
  if(dec===''||dec==null)dec=f==='moeda'?2:f==='pct'?1:(Number.isInteger(v)?0:2);
  dec=+dec;
  const big=compact==='force'||(compact&&Math.abs(v)>=100000);
  if(f==='moeda')return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',notation:big?'compact':'standard',minimumFractionDigits:big?0:dec,maximumFractionDigits:big?2:dec}).format(v);
  const s=new Intl.NumberFormat('pt-BR',{notation:big?'compact':'standard',minimumFractionDigits:big?0:dec,maximumFractionDigits:big?2:dec}).format(v);
  return f==='pct'?s+'%':s;
}
function describe(ind){
  if(ind.mode==='etapas')return 'Funil: '+(ind.steps||[]).join(' → ');
  if(ind.mode==='formula')return ind.formula;
  const c=ind.col?ind.col:'linhas';
  let d=`${AGG[ind.agg]||ind.agg} de ${c}`;
  if(ind.groupBy)d+=` por ${ind.groupBy}`;
  if((ind.filters||[]).filter(f=>f.col).length)d+=` · ${(ind.filters||[]).filter(f=>f.col).length} filtro(s)`;
  return d;
}

/* ============ gráficos ============ */
const charts=new Map();
function killCharts(scope){for(const[k,c]of charts){if(!scope||k.startsWith(scope)){c.destroy();charts.delete(k)}}}
const palette=()=>['--c1','--c2','--c3','--c4','--c5','--c6'].map(css);
function drawChart(canvas,key,ind,res){
  const g=res.groups||[{label:ind.name,value:res.total}];
  const labels=g.map(x=>x.label),data=g.map(x=>x.value==null?null:+x.value.toFixed(6));
  const ink=css('--ink'),muted=css('--muted'),line=css('--line'),acc=css('--accent'),pal=palette();
  Chart.defaults.font.family=css('--f-num');Chart.defaults.color=muted;
  const v=ind.viz,isPie=v==='rosca',horiz=v==='hbar',isLine=v==='linha'||v==='area';
  const ds=[{label:ind.name,data,borderColor:isPie?css('--surface'):acc,backgroundColor:isPie?labels.map((_,i)=>pal[i%pal.length]):(v==='area'?acc+'33':acc),
    fill:v==='area',tension:.3,borderWidth:isLine?2.4:isPie?2:0,pointRadius:isLine?(data.length>40?0:3):0,pointBackgroundColor:acc,borderRadius:isPie?0:5,maxBarThickness:46}];
  const tgt=num(ind.target);
  if(tgt!=null&&!isPie)ds.push({type:'line',label:'Meta',data:labels.map(()=>tgt),borderColor:css('--amber'),borderDash:[6,5],borderWidth:2,pointRadius:0,fill:false,backgroundColor:'transparent',indexAxis:horiz?'y':'x'});
  const tick={color:muted,font:{size:11}};
  const valAxis={grid:{color:line},border:{display:false},ticks:{...tick,callback:x=>fmt(x,ind,true)},beginAtZero:true};
  const catAxis={grid:{display:false},border:{color:line},ticks:{...tick,autoSkip:true,maxRotation:0}};
  const c=new Chart(canvas,{type:isPie?'doughnut':isLine?'line':'bar',data:{labels,datasets:ds},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:horiz?'y':'x',animation:{duration:matchMedia('(prefers-reduced-motion: reduce)').matches?0:350},
      cutout:isPie?'62%':undefined,
      plugins:{legend:{display:isPie||tgt!=null,position:isPie?'right':'bottom',labels:{color:ink,boxWidth:10,boxHeight:10,font:{size:11}}},
        tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${fmt(ctx.raw,ind,false)}`}}},
      scales:isPie?{}:(horiz?{x:valAxis,y:catAxis}:{x:catAxis,y:valAxis})}});
  charts.set(key,c);
}
function drawSpark(canvas,key,res){
  const acc=css('--accent');
  const c=new Chart(canvas,{type:'line',data:{labels:res.groups.map(g=>g.label),datasets:[{data:res.groups.map(g=>g.value),borderColor:acc,backgroundColor:acc+'22',fill:true,tension:.35,borderWidth:2,
    pointRadius:res.groups.map((_,i)=>i===res.groups.length-1?3:0),pointBackgroundColor:acc}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}});
  charts.set(key,c);
}

/* ============ card ============ */
function statusOf(v,ind){
  const t=num(ind.target);if(t==null||v==null||t===0)return null;
  const r=ind.lower?(v<=t?1:t/v):v/t;
  return{r,cls:r>=1?'good':r>=.8?'warn':'bad',txt:r>=1?'Meta atingida':r>=.8?'Perto da meta':'Abaixo da meta'};
}
function cardBody(ind,res,key){
  if(ind.viz==='funil'){
    const g=(res.groups||[{label:ind.name,value:res.total}]).slice(0,10);const max=Math.max(1,...g.map(x=>x.value||0));
    const pc=(a,b)=>b?new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format((a||0)/b*100)+'%':'—';
    return `<div class="funnel">${g.map((x,i)=>`<div class="fstep"><div class="fl"><span>${esc(x.label)}</span><b>${fmt(x.value,ind,true)}</b></div>
      <div class="fbar" role="img" aria-label="${esc(x.label)}: ${fmt(x.value,ind,false)}"><i style="width:${Math.max(1.5,(x.value||0)/max*100)}%;opacity:${Math.max(.45,1-i*.11)}"></i></div>
      ${i&&ind.mode==='etapas'?`<div class="fconv">${pc(x.value,g[i-1].value)} da etapa anterior · ${pc(x.value,g[0].value)} do início</div>`:''}</div>`).join('')}</div>`;
  }
  if(ind.viz==='kpi'){
    let h=`<div class="kpi-v">${fmt(res.total,ind,true)}</div>`;
    const st=statusOf(res.total,ind);
    if(st)h+=`<div class="bar" role="img" aria-label="${Math.round(st.r*100)}% da meta"><i style="width:${Math.min(100,st.r*100)}%;background:var(--${st.cls==='good'?'good':st.cls==='warn'?'warn':'bad'})"></i></div>
      <div class="kpi-s"><span class="pill ${st.cls}">${st.txt}</span><span>Meta ${fmt(num(ind.target),ind,true)} · ${new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(st.r*100)}%</span></div>`;
    if(res.isDate&&res.groups&&res.groups.length>1){
      const a=res.groups[res.groups.length-1],b=res.groups[res.groups.length-2];
      let delta='';if(a.value!=null&&b.value){const p=(a.value-b.value)/Math.abs(b.value)*100;const good=ind.lower?p<=0:p>=0;delta=`<span class="${good?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p).toLocaleString('pt-BR',{maximumFractionDigits:1})}% vs ${esc(b.label)}</span>`}
      h+=`<div class="kpi-s"><span>${esc(a.label)}: <b class="num">${fmt(a.value,ind,true)}</b></span>${delta}</div><div class="chart-box spark"><canvas data-spark="${key}" aria-label="Tendência"></canvas></div>`;
    }
    if(!res.isDate&&res.groups)h+=`<div class="kpi-s">${res.groups.slice(0,3).map(g=>`<span>${esc(g.label)}: <b class="num">${fmt(g.value,ind,true)}</b></span>`).join('')}</div>`;
    return h;
  }
  if(ind.viz==='tabela'){

    return `<div class="tbl-wrap"><table><thead><tr><th>${esc(ind.groupBy||'')}</th><th class="r">${esc(ind.name)}</th><th class="r">Linhas</th></tr></thead><tbody>
      ${g.map(x=>`<tr><td>${esc(x.label)}</td><td class="r num">${fmt(x.value,ind,false)}</td><td class="r num">${x.rows.length.toLocaleString('pt-BR')}</td></tr>`).join('')}
      ${res.groups?`<tr><td><b>Total</b></td><td class="r num"><b>${fmt(res.total,ind,false)}</b></td><td class="r num">${res.n.toLocaleString('pt-BR')}</td></tr>`:''}</tbody></table></div>`;
  }

}
function cardHTML(ind,key,withActs){

  catch(e){body=`<div class="err">${esc(e.message)}</div>`}

cardHTML.last={};

  root.querySelectorAll('canvas[data-chart]').forEach(cv=>{const k=cv.dataset.chart,L=cardHTML.last[k];if(L)drawChart(cv,k,L.ind,L.res)});
  root.querySelectorAll('canvas[data-spark]').forEach(cv=>{const k=cv.dataset.spark,L=cardHTML.last[k];if(L)drawSpark(cv,k+'s',L.res)});
}

/* ============ destaques calculados ============ */
const pf=v=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:Math.abs(v)<10?1:0}).format(v);
function baseName(ind){let n=ind.name.replace(/ por (mês|semana|dia|trimestre|ano)$/i,'');
  if(ind.groupBy){const g=' por '+ind.groupBy.toLowerCase();if(n.toLowerCase().endsWith(g))n=n.slice(0,-g.length)}
  return n.replace(/, por .+$/i,'')}
function isPartial(a,b){
  const days=g=>{const set=new Set();for(const r of g.rows)for(const k in r){const d=toDate(r[k]);if(d){set.add(isoDay(d));break}}return set.size};
  const da=days(a),db=days(b);return db>3&&da<db*.7;
}
function highlights(s){
  const out=[],seen=new Set();
  for(const ind of S.indicators.filter(i=>i.sourceId===s.id)){
    let r;try{r=compute(ind)}catch(e){continue}
    const base=baseName(ind),F=(v,big)=>`<b>${esc(fmt(v,ind,big?'force':true))}</b>`;
    if(r.isDate&&r.groups&&r.groups.length>=2&&!seen.has('t:'+base)){
      seen.add('t:'+base);
      const a=r.groups[r.groups.length-1],b=r.groups[r.groups.length-2];
      if(a.value==null||b.value==null||b.value===0)continue;
      const p=(a.value-b.value)/Math.abs(b.value)*100,part=isPartial(a,b),big=Math.max(Math.abs(a.value),Math.abs(b.value))>=100000;
      const good=ind.lower?p<0:p>0;
      if(Math.abs(p)<1)out.push({w:1,tone:'neutral',t:`${esc(base)} ficou estável em ${esc(a.label)}: ${F(a.value)}.`});
      else out.push({w:Math.min(60,Math.abs(p))+(part?0:10),tone:part?'neutral':good?'good':'bad',t:`${esc(base)} ${p>0?'subiu':'caiu'} <b>${pf(Math.abs(p))}%</b> em ${esc(a.label)} na comparação com ${esc(b.label)} (${F(b.value,big)} → ${F(a.value,big)})${part?', mas o período ainda está em andamento':''}.`});
    }
    if(!r.isDate&&r.groups&&r.groups.length>=2&&ind.mode!=='etapas'&&!seen.has('d:'+ind.name)){
      seen.add('d:'+ind.name);
      const g=r.groups.filter(x=>x.value!=null&&x.key!=='__outros');if(g.length<2)continue;
      const dim=(ind.groupBy||'').toLowerCase();
      const additive=ind.mode==='simples'&&['soma','contar'].includes(ind.agg);
      if(additive&&r.total>0){const top=g.reduce((a,b)=>b.value>a.value?b:a);const sh=top.value/r.total*100;
        if(sh>=30)out.push({w:sh/2,tone:'neutral',t:`${esc(top.label)} concentra <b>${pf(sh)}%</b> de ${esc(base.toLowerCase())} (${F(top.value)}).`});}
      else if(!additive){const sorted=g.slice().sort((a,b)=>a.value-b.value);const best=ind.lower?sorted[0]:sorted[sorted.length-1],worst=ind.lower?sorted[sorted.length-1]:sorted[0];
        if(best.value!==worst.value)out.push({w:25,tone:'neutral',t:`${esc(/ por /i.test(ind.name)?ind.name:base+' por '+dim)}: melhor resultado em ${esc(best.label)} (${F(best.value)}) e pior em ${esc(worst.label)} (${F(worst.value)}).`});}
    }
    if(ind.mode==='etapas'&&r.groups&&r.groups.length>=3){
      let worst=null;for(let i=1;i<r.groups.length;i++){const a=r.groups[i-1].value,b=r.groups[i].value;if(a>0){const c=b/a;if(!worst||c<worst.c)worst={c,from:r.groups[i-1].label,to:r.groups[i].label}}}
      if(worst)out.push({w:30,tone:'bad',t:`No funil, a maior perda está entre ${esc(worst.from)} e ${esc(worst.to)}: só <b>${pf(worst.c*100)}%</b> passam para a etapa seguinte.`});
    }
    const t=num(ind.target);
    if(t!=null&&r.total!=null&&!seen.has('m:'+base)&&(!r.groups||r.isDate)){
      seen.add('m:'+base);const st=statusOf(r.total,ind);if(!st)continue;
      const dif=Math.abs(r.total-t)/Math.abs(t)*100;
      const ok=st.r>=1;
      out.push({w:ok?20:35+dif/2,tone:ok?'good':'bad',t:ok?`${esc(base)} está dentro da meta: ${F(r.total)} para uma meta de ${F(t)}.`:`${esc(base)} está <b>${pf(dif)}%</b> ${ind.lower?'acima':'abaixo'} da meta: ${F(r.total)} para uma meta de ${F(t)}.`});
    }
  }
  return out.sort((a,b)=>b.w-a.w).slice(0,6);
}

  brand:{nome:'Brand',kpis:'Menções da marca, Share of voice (menções da marca / menções de todas as marcas × 100), Sentimento (% positivo, % negativo), Alcance estimado, Menções por fonte, Evolução das menções e do share of voice no tempo'},

/* ============ painel automático ============ */
const nrm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const CONCEITOS={
  views:['visualizacoes','visualizacao','views','video views','reproducoes','plays','visualizacoes do video'],
  alcance:['alcance','reach','contas alcancadas','pessoas alcancadas'],
  impressoes:['impressoes','impressions','exibicoes'],
  curtidas:['curtidas','likes','reacoes','reactions','gostei'],
  comentarios:['comentarios','comments'],
  compart:['compartilhamentos','shares','envios','reposts'],
  salvos:['salvamentos','salvos','saves'],
  engaj:['engajamento','engagement','interacoes','interactions','engajamento total'],
  seguidores:['seguidores ganhos','novos seguidores','seguidores','seguimentos','followers','follows','ganho de seguidores'],
  cliques:['cliques no link','cliques','clicks','link clicks','cliques no link unicos'],
  invest:['investimento','valor investido','valor gasto','valor usado','valor usado brl','gasto','custo total','spend','amount spent','cost','verba','custo'],
  leads:['leads','cadastros','resultados','results','contatos gerados'],
  conv:['conversoes','conversions','compras','purchases','vendas'],
  receita:['receita','faturamento','revenue','valor de conversao','conversion value','valor das compras'],
  visitantes:['visitantes','visitas','sessoes','sessions','usuarios','users','acessos'],
  mql:['mql','mqls','leads qualificados'],
  sql:['sql','sqls','oportunidades','opportunities'],
  clientes:['clientes','novos clientes','customers','fechamentos','contratos fechados'],
  mencoes:['mencoes','mentions','citacoes'],
  enviados:['enviados','sent','destinatarios','publico','disparos','entregues'],
  abertos:['abertos','aberturas','opens','lidos','leituras'],
  convidados:['convidados','inscritos','invited'],
  participantes:['participantes','presentes','attendees','presenca'],
  posts:['posts','publicacoes','quantidade de posts']
};
const DIM_PRIO=['canal','rede','plataforma','formato','campanha','fonte','midia','origem','area','tipo','marca','tema','categoria','conjunto','anuncio','sentimento','vertical','produto','publico'];
const safeCol=n=>!/[();"]/.test(n);
/* lê o conteúdo da coluna para saber como somar/mostrar */
const KCACHE=new WeakMap();
function colKind(s,c){
  let cache=KCACHE.get(s);if(!cache){cache={};KCACHE.set(s,cache)}
  if(cache[c.name])return cache[c.name];
  const n=nrm(c.name);const raw=c.name.toLowerCase();
  const xs=[];let money=0,pctRaw=0,k=0;
  for(const r of s.rows){const v=r[c.name];if(empty(v))continue;k++;if(typeof v==='string'){if(/r\$/i.test(v))money++;if(/%/.test(v))pctRaw++}const x=num(v);if(x!=null)xs.push(x);if(k>=2000)break}
  const uniq=new Set(xs).size,ints=xs.every(x=>Number.isInteger(x)),frac01=xs.length&&xs.every(x=>x>=0&&x<=1)&&!ints;
  let kind='soma',format='num';
  if(/(^| )(id|codigo|cod|cpf|cnpj|telefone|celular|cep|matricula|protocolo|ano)( |$)/.test(n)||(ints&&xs.length>20&&uniq===xs.length&&Math.min(...xs.slice(0,500))>1000))kind='id';
  else if(/%|percent/.test(raw)||/(^| )(taxa|rate|ctr|cpc|cpm|cpl|cpa|cac|roas|media|medio|average|avg|frequencia|ticket|nota|score|indice|posicao|custo por|valor por|por resultado|por clique|por lead)( |$)/.test(n)||pctRaw>k*.5||frac01)kind='media';
  if(pctRaw>k*.5||/%|percent|taxa|rate|ctr/.test(raw))format='pct';
  else if(money>k*.3||/(^| )(valor|receita|faturamento|custo|gasto|investimento|verba|brl|r|preco|ticket|cpc|cpl|cpa|cac|cpm)( |$)/.test(n))format='moeda';
  return cache[c.name]={kind,format,scale:frac01&&format==='pct'?100:1,fill:k/Math.max(1,s.rows.length)};
}
function mapColumns(s){
  const nums=s.columns.filter(c=>c.type==='numero'&&colKind(s,c).kind==='soma'),used=new Set(),m={};
  for(const pass of ['exato','contem'])for(const[k,syn]of Object.entries(CONCEITOS)){
    if(m[k])continue;
    const hit=nums.find(c=>!used.has(c.name)&&safeCol(c.name)&&syn.some(w=>pass==='exato'?nrm(c.name)===w:(' '+nrm(c.name)+' ').includes(' '+w+' ')));
    if(hit){m[k]=hit.name;used.add(hit.name)}
  }
  return m;
}
function detectArea(m){
  const has=k=>m[k]?1:0;
  const sc={
    social:has('views')*2+has('alcance')+has('curtidas')+has('comentarios')+has('compart')+has('salvos')+has('seguidores')*2+has('engaj'),
    trafego:has('invest')*3+has('cliques')+has('impressoes')+has('leads')+has('conv')+has('receita'),
    growth:has('visitantes')*2+has('mql')*3+has('sql')*2+has('clientes')*2+has('leads'),
    brand:has('mencoes')*5,
    interna:(has('enviados')&&has('abertos'))*5+has('participantes')*2+has('convidados')
  };
  const best=Object.entries(sc).sort((a,b)=>b[1]-a[1])[0];
  return best[1]>=2?best[0]:'geral';
}
function pickDate(s){
  const ds=s.columns.filter(c=>c.type==='data');
  return ds.find(c=>/data|date|dia|periodo|mes/i.test(nrm(c.name)))||ds[0]||null;
}
function pickGran(s,dc){
  if(!dc)return 'mes';let a=Infinity,b=-Infinity;const set=new Set();
  for(const r of s.rows){const d=toDate(r[dc.name]);if(d){const t=d.getTime();if(t<a)a=t;if(t>b)b=t;set.add(isoDay(d))}}
  const days=(b-a)/864e5,months=days/30.4;
  if(set.size<=Math.ceil(months)+1)return 'mes';
  return days>150?'mes':days>20?'semana':'dia';
}
function pickDims(s){
  const out=[];
  for(const c of s.columns){
    if(c.type!=='texto'||!safeCol(c.name))continue;
    const set=new Set();for(const r of s.rows){const v=String(r[c.name]??'').trim();if(v)set.add(v);if(set.size>40)break}
    if(set.size<2||set.size>25)continue;
    const n=nrm(c.name);const pi=DIM_PRIO.findIndex(w=>n.includes(w));
    out.push({name:c.name,n:set.size,score:(pi<0?50:pi)+(set.size>12?20:0)});
  }
  return out.sort((a,b)=>a.score-b.score);
}
function autoIndicators(s){
  const m=mapColumns(s),area=detectArea(m),dc=pickDate(s),gran=pickGran(s,dc),dims=pickDims(s);
  const D=dc?dc.name:'',d1=dims[0],d2=dims[1];
  const B={sourceId:s.id,filters:[],gran,limit:10,decimals:'',target:'',lower:false,wide:false};
  const S_=(name,col,extra={})=>({...B,id:uid(),name,mode:'simples',agg:'soma',col,groupBy:D,viz:'kpi',format:'num',...extra});
  const F_=(name,formula,extra={})=>({...B,id:uid(),name,mode:'formula',formula,groupBy:D,viz:'kpi',format:'num',...extra});
  const SUM=k=>`SOMA(${m[k]})`;
  const engParts=['curtidas','comentarios','compart','salvos'].filter(k=>m[k]);
  const ENG=m.engaj?SUM('engaj'):engParts.length>=2?'('+engParts.map(SUM).join(' + ')+')':'';
  const cards=[],rates=[],vol=[];
  // métricas de volume por prioridade de área
  const VOL={social:['views','alcance','impressoes','seguidores','cliques'],trafego:['invest','impressoes','cliques','leads','conv','receita'],
    growth:['visitantes','leads','clientes','receita','invest'],brand:['mencoes','alcance'],interna:['enviados','abertos','cliques','participantes'],
    geral:['invest','receita','views','alcance','leads','conv','clientes','cliques','impressoes']}[area];
  for(const k of VOL)if(m[k])vol.push(k);
  const money=k=>['invest','receita'].includes(k);
  const LABEL={views:'Visualizações',alcance:'Alcance',impressoes:'Impressões',seguidores:'Seguidores ganhos',cliques:'Cliques',invest:'Investimento',leads:'Leads',conv:'Conversões',receita:'Receita',visitantes:'Visitantes',clientes:'Novos clientes',mencoes:'Menções',enviados:'Enviados',abertos:'Aberturas',participantes:'Participantes'};
  // taxas e custos possíveis
  if(ENG&&(m.alcance||m.impressoes||m.views))rates.push(F_('Taxa de engajamento',`${ENG} / ${SUM(m.alcance?'alcance':m.impressoes?'impressoes':'views')} * 100`,{format:'pct',decimals:'2'}));
  if(m.cliques&&m.impressoes)rates.push(F_('CTR',`${SUM('cliques')} / ${SUM('impressoes')} * 100`,{format:'pct',decimals:'2'}));
  if(m.invest&&m.leads)rates.push(F_('Custo por lead (CPL)',`${SUM('invest')} / ${SUM('leads')}`,{format:'moeda',lower:true}));
  if(m.invest&&m.cliques)rates.push(F_('CPC',`${SUM('invest')} / ${SUM('cliques')}`,{format:'moeda',lower:true}));
  if(m.invest&&m.impressoes&&!m.leads)rates.push(F_('CPM',`${SUM('invest')} / ${SUM('impressoes')} * 1000`,{format:'moeda',lower:true}));
  if(m.invest&&m.clientes)rates.push(F_('CAC',`${SUM('invest')} / ${SUM('clientes')}`,{format:'moeda',lower:true}));
  if(m.receita&&m.invest)rates.push(F_('ROAS',`${SUM('receita')} / ${SUM('invest')}`,{decimals:'2'}));
  const fim=m.clientes||m.conv;
  if(m.leads&&fim)rates.push(F_('Conversão lead → '+(m.clientes?'cliente':'venda'),`${SUM(m.clientes?'clientes':'conv')} / ${SUM('leads')} * 100`,{format:'pct'}));
  if(m.abertos&&m.enviados)rates.push(F_('Taxa de abertura',`${SUM('abertos')} / ${SUM('enviados')} * 100`,{format:'pct'}));
  if(m.cliques&&m.abertos&&area==='interna')rates.push(F_('Taxa de clique',`${SUM('cliques')} / ${SUM('abertos')} * 100`,{format:'pct'}));
  if(m.participantes&&m.convidados)rates.push(F_('Participação',`${SUM('participantes')} / ${SUM('convidados')} * 100`,{format:'pct'}));
  // cartões: 2 volumes + 2 taxas (ou o que houver)
  const vcards=vol.slice(0,rates.length>=2?2:4-Math.min(rates.length,2)).map(k=>S_(LABEL[k],m[k],{format:money(k)?'moeda':'num'}));
  cards.push(...vcards,...rates.slice(0,4-vcards.length));
  // colunas que não reconheci pelo nome: decide pelo conteúdo
  const usedCols=new Set(Object.values(m));
  const extra=s.columns.filter(c=>c.type==='numero'&&safeCol(c.name)&&!usedCols.has(c.name)).map(c=>({c,k:colKind(s,c)})).filter(x=>x.k.kind!=='id'&&x.k.fill>.3)
    .sort((a,b)=>(a.k.kind==='soma'?0:1)-(b.k.kind==='soma'?0:1)||b.k.fill-a.k.fill);
  for(const{c,k}of extra){
    if(cards.length>=4)break;
    if(k.kind==='media')cards.push(k.scale===100?F_(c.name,`MEDIA(${c.name}) * 100`,{format:'pct'}):S_(c.name,c.name,{agg:'media',format:k.format}));
    else cards.push(S_(c.name,c.name,{format:k.format}));
  }
  if(!cards.length)cards.push({...B,id:uid(),name:'Registros',mode:'simples',agg:'contar',col:'',groupBy:D,viz:'kpi',format:'num'});
  const out=[...cards];
  const main=cards[0];
  // evolução no tempo
  if(D&&main)out.push({...main,id:uid(),name:main.name+(gran==='mes'?' por mês':gran==='semana'?' por semana':' por dia'),viz:'area',wide:true,target:'',lower:main.lower});
  // funil
  const steps=['impressoes','visitantes','cliques','leads','mql','sql','conv','clientes'].filter(k=>m[k]);
  const fsteps=area==='trafego'?steps.filter(k=>['impressoes','cliques','leads','conv'].includes(k)):steps.filter(k=>k!=='impressoes'||!m.visitantes);
  if(fsteps.length>=3)out.push({...B,id:uid(),name:'Funil',mode:'etapas',steps:fsteps.map(k=>m[k]),groupBy:'',viz:'funil',format:'num',wide:true});
  // quebras por dimensão
  if(d1&&main){
    const bestRate=rates[0];
    if(bestRate)out.push({...bestRate,id:uid(),name:`${bestRate.name} por ${d1.name.toLowerCase()}`,groupBy:d1.name,viz:'hbar'});
    const v=cards.find(c=>c.mode==='simples')||main;
    out.push({...v,id:uid(),name:`${v.name} por ${d1.name.toLowerCase()}`,groupBy:d1.name,viz:d1.n<=6?'rosca':'hbar',target:''});
  }
  if((d2||d1)&&rates.length>1){const dd=d2||d1;const r=rates[1];out.push({...r,id:uid(),name:`${r.name} por ${dd.name.toLowerCase()}`,groupBy:dd.name,viz:'tabela'})}
  else if(d2&&main)out.push({...main,id:uid(),name:`${main.name} por ${d2.name.toLowerCase()}`,groupBy:d2.name,viz:'tabela'});
  // mantém só o que calcula
  const ok=out.filter(i=>{try{const r=compute(i);return r.total!=null}catch(e){return false}});
  return{area,inds:ok.slice(0,10)};
}
function similarSource(fresh){
  const cols=new Set(fresh.columns.map(c=>nrm(c.name)));let best=null,bs=0;
  for(const o of S.sources){
    if(o.id===fresh.id)continue;const inds=S.indicators.filter(i=>i.sourceId===o.id);if(!inds.length)continue;
    const oc=o.columns.map(c=>nrm(c.name));const inter=oc.filter(c=>cols.has(c)).length;
    const sc=inter/Math.max(oc.length,cols.size)+(o.sample?0:.05);
    if(sc>bs){bs=sc;best=o}
  }
  return bs>=.7?best:null;
}
function fillSource(fresh){
  const sim=similarSource(fresh);
  if(sim){
    const map=Object.fromEntries(fresh.columns.map(c=>[nrm(c.name),c.name]));
    const fixName=n=>n?(map[nrm(n)]||n):n;
    const copies=S.indicators.filter(i=>i.sourceId===sim.id).map(i=>{const c=JSON.parse(JSON.stringify(i));c.id=uid();c.sourceId=fresh.id;
      c.col=fixName(c.col);c.groupBy=fixName(c.groupBy);c.steps=(c.steps||[]).map(fixName);c.filters=(c.filters||[]).map(f=>({...f,col:fixName(f.col)}));return c})
      .filter(i=>{try{compute(i);return true}catch(e){return false}});
    if(copies.length){fresh.area=sim.area||'geral';S.indicators.push(...copies);return{n:copies.length,from:sim.name}}
  }
  const a=autoIndicators(fresh);fresh.area=a.area;S.indicators.push(...a.inds);return{n:a.inds.length,auto:true};
}
function autoForActive(force){
  const s=activeSrc();if(!s)return;
  const cur=S.indicators.filter(i=>i.sourceId===s.id).length;
  const btn=$('#autoBtn');
  if(cur&&!force){
    if(btn.dataset.confirm!=='1'){btn.dataset.confirm='1';btn.textContent=`Substituir os ${cur} indicadores?`;btn.classList.add('warn-btn');
      clearTimeout(autoForActive.t);autoForActive.t=setTimeout(()=>{btn.dataset.confirm='';btn.textContent='Refazer painel';btn.classList.remove('warn-btn')},4000);return}
  }
  btn.dataset.confirm='';btn.classList.remove('warn-btn');
  S.indicators=S.indicators.filter(i=>i.sourceId!==s.id);
  const a=autoIndicators(s);s.area=a.area!=='geral'?a.area:(s.area||'geral');
  S.indicators.push(...a.inds);save();renderAll();
  toast(`Painel refeito com ${a.inds.length} indicadores a partir da planilha`);
}
function readSheet(ws){
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true,blankrows:false});
  if(!aoa.length)return[];
  const filled=r=>r.filter(v=>!empty(v)).length;
  const top=aoa.slice(0,15);const max=Math.max(...top.map(filled));
  let h=top.findIndex(r=>filled(r)>=Math.max(2,max*.6)&&r.filter(v=>!empty(v)).every(v=>typeof v==='string'&&!toDate(v)&&num(v)==null));
  if(h<0)h=0;
  const seen={};const head=aoa[h].map((v,i)=>{let n=String(v??'').trim().replace(/[();"]/g,' ').replace(/\s+/g,' ').trim()||`Coluna ${i+1}`;if(seen[n]){seen[n]++;n=`${n} ${seen[n]}`}else seen[n]=1;return n});
  return aoa.slice(h+1).map(r=>{const o={};head.forEach((k,i)=>{o[k]=r[i]??''});return o});
}

  el.innerHTML=DUI.undo&&DUI.undo.sid===s.id?`<button class="btn sm" id="dUndoBtn" style="min-height:40px">Desfazer: ${esc(DUI.undo.label)}</button>`:'';
}
function renderDataTable(){
  const s=activeSrc(),cols=s.columns;const q=DUI.q.trim().toLowerCase();
  const idx=[];for(let i=0;i<s.rows.length&&idx.length<200;i++){if(!q||cols.some(c=>String(s.rows[i][c.name]??'').toLowerCase().includes(q)))idx.push(i)}
  const use=c=>S.indicators.filter(i=>i.sourceId===s.id&&(i.col===c||i.groupBy===c||(i.steps||[]).includes(c)||(i.filters||[]).some(f=>f.col===c)||(i.formula||'').toLowerCase().includes(c.toLowerCase()))).length;
  $('#dInfo').textContent=`${s.rows.length.toLocaleString('pt-BR')} linhas no total${q?` · ${idx.length===200?'200+':idx.length} encontrada(s) para "${DUI.q.trim()}"`:''} · mostrando até 200. O tipo de cada coluna define como ela é somada e agrupada: corrija se algum foi detectado errado.`;
  $('#dTbl').innerHTML=`<table><thead><tr><th style="width:44px"></th>${cols.map((c,i)=>`<th><div style="display:flex;align-items:center;gap:4px;justify-content:space-between">${esc(c.name)}<button class="ic" data-delcol="${i}" data-use="${use(c.name)}" aria-label="Excluir a coluna ${esc(c.name)}" title="Excluir coluna" style="width:26px;height:26px">${ICON.del}</button></div><select data-type="${i}" aria-label="Tipo de ${esc(c.name)}">
    ${['texto','numero','data'].map(t=>`<option value="${t}" ${c.type===t?'selected':''}>${t==='numero'?'número':t}</option>`).join('')}</select></th>`).join('')}</tr></thead>
  <tbody>${idx.map(i=>`<tr><td><button class="ic" data-delrow="${i}" aria-label="Excluir esta linha" title="Excluir linha" style="width:28px;height:28px">${ICON.x}</button></td>${cols.map(c=>`<td class="${c.type==='numero'?'r num':''}">${esc(s.rows[i][c.name])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" style="color:var(--muted)">Nenhuma linha encontrada.</td></tr>`}</tbody></table>`;
}
function snapshot(s,label){DUI.undo={sid:s.id,rows:s.rows,columns:JSON.parse(JSON.stringify(s.columns)),label}}
function afterDataChange(msg){save();renderSide();renderHead();renderDataTable();updateRuleBtn();renderUndo();toast(msg)}
function twoClick(b,txt,go){
  if(b.dataset.confirm!=='1'){const old=b.innerHTML;b.dataset.confirm='1';b.classList.add(b.classList.contains('ic')?'confirm':'warn-btn');b.textContent=txt;
    setTimeout(()=>{if(b.isConnected&&b.dataset.confirm==='1'){b.dataset.confirm='';b.classList.remove('confirm','warn-btn');b.innerHTML=old}},3500);return}
  go();
}
let dqT;
$('#viewData').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='dQ'){DUI.q=t.value;clearTimeout(dqT);dqT=setTimeout(renderDataTable,200)}
  if(t.id==='dRv'){DUI.rv=t.value;updateRuleBtn()}
});
$('#viewData').addEventListener('change',e=>{
  const t=e.target,s=activeSrc();
  if(t.dataset.type!=null){s.columns[+t.dataset.type].type=t.value;KCACHE.delete(s);save();renderDataTable();toast('Tipo da coluna atualizado');return}
  if(t.id==='dRc'){DUI.rc=t.value;DUI.rv='';renderData();return}
  if(t.id==='dRop'){DUI.rop=t.value;renderData();return}
});
$('#viewData').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const s=activeSrc();
  if(b.id==='dRgo'){const rr=ruleRows(s);if(!rr||!rr.length)return;
    twoClick(b,`Confirmar: excluir ${rr.length.toLocaleString('pt-BR')}?`,()=>{const del=new Set(rr);snapshot(s,`${rr.length} linha(s) excluída(s)`);s.rows=s.rows.filter(r=>!del.has(r));DUI.rv='';renderData();afterDataChange(`${rr.length.toLocaleString('pt-BR')} linha(s) excluída(s)`)})}
  if(b.dataset.delrow!=null){const i=+b.dataset.delrow;
    twoClick(b,'Excluir?',()=>{snapshot(s,'1 linha excluída');s.rows=s.rows.filter((_,k)=>k!==i);afterDataChange('Linha excluída')})}
  if(b.dataset.delcol!=null){const c=s.columns[+b.dataset.delcol];const n=+b.dataset.use;
    twoClick(b,n?`Excluir? Usada em ${n} indicador(es)`:'Excluir coluna?',()=>{snapshot(s,`coluna ${c.name} excluída`);s.rows=s.rows.map(r=>{const o={...r};delete o[c.name];return o});s.columns=s.columns.filter(x=>x!==c);KCACHE.delete(s);afterDataChange(`Coluna ${c.name} excluída`)})}
  if(b.id==='dUndoBtn'&&DUI.undo&&DUI.undo.sid===s.id){s.rows=DUI.undo.rows;s.columns=DUI.undo.columns;DUI.undo=null;KCACHE.delete(s);renderData();save();renderSide();renderHead();toast('Exclusão desfeita')}
});

/* ============ dados de exemplo ============ */
const SAMPLE_VER=3;
function rng(seed){return()=>(seed=(seed*16807)%2147483647)/2147483647}
const R2=x=>Math.round(x*100)/100;
function eachDay(n,fn){const start=new Date(2026,6,1);for(let i=0;i<n;i++){const d=new Date(start);d.setDate(d.getDate()+i);fn(d,i)}}
const SAMPLES={
  social(){
    const r=rng(21),rows=[];
    const RED={Instagram:[1.0,.055],LinkedIn:[.45,.045],TikTok:[1.8,.07],YouTube:[.7,.04],Facebook:[.35,.02]};
    const FMT={Reels:1.6,'Carrossel':1.0,'Estático':.6,Stories:.8,'Vídeo':1.2};
    const TEMA=['Institucional','Produto','Cultura','Dicas','Bastidores','Evento'];
    eachDay(92,(d,i)=>{for(const[rede,[mult,eng]]of Object.entries(RED)){if(r()>.42)continue;
      const fmt=Object.keys(FMT)[Math.floor(r()*5)],tema=TEMA[Math.floor(r()*TEMA.length)];
      if(rede==='YouTube'&&fmt!=='Vídeo'&&fmt!=='Reels')continue;
      const views=Math.round((1800+r()*5200)*mult*FMT[fmt]*(1+i/150)*(tema==='Bastidores'?1.3:1));
      const alc=Math.round(views*(.55+r()*.2)),imp=Math.round(views*(1.1+r()*.3));
      const e=alc*eng*(.6+r()*.8)*(fmt==='Carrossel'?1.35:1);
      rows.push({Data:isoDay(d),Rede:rede,Formato:fmt,Tema:tema,'Visualizações':views,Alcance:alc,'Impressões':imp,
        Curtidas:Math.round(e*.72),'Comentários':Math.round(e*.06),Compartilhamentos:Math.round(e*.1),Salvamentos:Math.round(e*.12*(tema==='Dicas'?2:1)),
        'Seguidores ganhos':Math.round(alc*.004*(.5+r())),'Cliques no link':Math.round(alc*.006*(.5+r()))})}});
    const B={filters:[],gran:'mes',limit:10,decimals:'',target:'',lower:false,wide:false};
    const ENG='(SOMA(Curtidas) + SOMA(Comentários) + SOMA(Compartilhamentos) + SOMA(Salvamentos))';
    return{name:'exemplo_social_media.xlsx',rows,ind:[
      {...B,name:'Visualizações',mode:'simples',agg:'soma',col:'Visualizações',groupBy:'Data',viz:'kpi'},
      {...B,name:'Alcance',mode:'simples',agg:'soma',col:'Alcance',groupBy:'Data',viz:'kpi'},
      {...B,name:'Taxa de engajamento',mode:'formula',formula:`${ENG} / SOMA(Alcance) * 100`,groupBy:'Data',viz:'kpi',format:'pct',decimals:'2',target:'5'},
      {...B,name:'Seguidores ganhos',mode:'simples',agg:'soma',col:'Seguidores ganhos',groupBy:'Data',viz:'kpi'},
      {...B,name:'Visualizações por semana',mode:'simples',agg:'soma',col:'Visualizações',groupBy:'Data',gran:'semana',viz:'area',wide:true},
      {...B,name:'Visualizações por rede',mode:'simples',agg:'soma',col:'Visualizações',groupBy:'Rede',viz:'rosca'},
      {...B,name:'Engajamento por formato',mode:'formula',formula:`${ENG} / SOMA(Alcance) * 100`,groupBy:'Formato',viz:'hbar',format:'pct',decimals:'2',target:'5'},
      {...B,name:'Média de visualizações por tema',mode:'simples',agg:'media',col:'Visualizações',groupBy:'Tema',viz:'bar',decimals:'0'},
      {...B,name:'Visualizações por post, por rede',mode:'formula',formula:'SOMA(Visualizações) / LINHAS()',groupBy:'Rede',viz:'tabela',decimals:'0'}
    ]};
  },
  trafego(){
    const r=rng(11),rows=[];
    const CH={'Google Ads':{inv:[380,900],cpm:38,ctr:.042,lr:.085},'Meta Ads':{inv:[260,700],cpm:22,ctr:.015,lr:.06},'LinkedIn Ads':{inv:[300,820],cpm:95,ctr:.008,lr:.11},'TikTok Ads':{inv:[120,380],cpm:14,ctr:.011,lr:.03}};
    const CAMP=[['Cobrança Digital — Captação',1100],['Atendimento — Webinar',700],['Leitura — Institucional',1500],['Remarketing T3',950]];
    eachDay(92,(d,day)=>{const m=Math.floor(day/31);for(const[ch,p]of Object.entries(CH))for(const[camp,ticket]of CAMP){if(r()>.4)continue;
      const inv=R2((p.inv[0]+r()*(p.inv[1]-p.inv[0]))*(1+m*.08));const imp=Math.round(inv/p.cpm*1000*(.8+r()*.4));
      const cli=Math.round(imp*p.ctr*(.7+r()*.6)*(1+m*.06));const leads=Math.round(cli*p.lr*(.6+r()*.8));const conv=Math.round(leads*(.06+r()*.07));
      rows.push({Data:isoDay(d),Plataforma:ch,Campanha:camp,Investimento:inv,'Impressões':imp,Cliques:cli,Leads:leads,'Conversões':conv,Receita:Math.round(conv*ticket*(.8+r()*.4))})}});
    const B={filters:[],gran:'mes',limit:10,decimals:'',target:'',lower:false,wide:false};
    return{name:'exemplo_trafego_pago.xlsx',rows,ind:[
      {...B,name:'Investimento',mode:'simples',agg:'soma',col:'Investimento',groupBy:'Data',viz:'kpi',format:'moeda'},
      {...B,name:'CTR',mode:'formula',formula:'SOMA(Cliques) / SOMA(Impressões) * 100',groupBy:'Data',viz:'kpi',format:'pct',decimals:'2',target:'1.5'},
      {...B,name:'Custo por lead (CPL)',mode:'formula',formula:'SOMA(Investimento) / SOMA(Leads)',groupBy:'Data',viz:'kpi',format:'moeda',target:'25',lower:true},
      {...B,name:'ROAS',mode:'formula',formula:'SOMA(Receita) / SOMA(Investimento)',groupBy:'Data',viz:'kpi',decimals:'2',target:'3'},
      {...B,name:'Funil de mídia',mode:'etapas',steps:['Impressões','Cliques','Leads','Conversões'],groupBy:'',viz:'funil',wide:true},
      {...B,name:'CPL por plataforma',mode:'formula',formula:'SOMA(Investimento) / SOMA(Leads)',groupBy:'Plataforma',viz:'hbar',format:'moeda',target:'25',lower:true},
      {...B,name:'Investimento por semana',mode:'simples',agg:'soma',col:'Investimento',groupBy:'Data',gran:'semana',viz:'area',format:'moeda',wide:true},
      {...B,name:'ROAS por campanha',mode:'formula',formula:'SOMA(Receita) / SOMA(Investimento)',groupBy:'Campanha',viz:'tabela',decimals:'2'}
    ]};
  },
  brand(){
    const r=rng(31),rows=[];
    const MARCAS={'M&F':[1,.62,.12],'Concorrente A':[.9,.48,.2],'Concorrente B':[.55,.5,.16]};
    const FONTE={Instagram:1.2,LinkedIn:.9,'Notícias':.5,'Reclame Aqui':.35,'Google Reviews':.4};
    eachDay(92,(d,i)=>{for(const[marca,[mult,pos,neg]]of Object.entries(MARCAS))for(const[f,fm]of Object.entries(FONTE)){
      const tot=Math.round((4+r()*14)*mult*fm*(marca==='M&F'?1+i/180:1));if(!tot)continue;
      const negX=f==='Reclame Aqui'?2.4:1;const np=Math.min(.7,neg*negX),pp=Math.max(.1,pos-(np-neg));
      const split={Positivo:Math.round(tot*pp),Negativo:Math.round(tot*np)};split.Neutro=Math.max(0,tot-split.Positivo-split.Negativo);
      for(const[sent,n]of Object.entries(split))if(n)rows.push({Data:isoDay(d),Marca:marca,Fonte:f,Sentimento:sent,'Menções':n,'Alcance estimado':Math.round(n*(300+r()*1500)*fm)})}});
    const B={filters:[],gran:'mes',limit:10,decimals:'',target:'',lower:false,wide:false};
    const MF=[{col:'Marca',op:'=',val:'M&F'}];
    return{name:'exemplo_brand.xlsx',rows,ind:[
      {...B,name:'Menções da marca',mode:'simples',agg:'soma',col:'Menções',groupBy:'Data',viz:'kpi',filters:MF},
      {...B,name:'Share of voice',mode:'formula',formula:'SOMA_SE(Menções; Marca; "M&F") / SOMA(Menções) * 100',groupBy:'Data',viz:'kpi',format:'pct',target:'40'},
      {...B,name:'Sentimento positivo',mode:'formula',formula:'SOMA_SE(Menções; Sentimento; "Positivo") / SOMA(Menções) * 100',groupBy:'Data',viz:'kpi',format:'pct',target:'60',filters:MF},
      {...B,name:'Alcance estimado',mode:'simples',agg:'soma',col:'Alcance estimado',groupBy:'Data',viz:'kpi',filters:MF},
      {...B,name:'Share of voice por semana',mode:'formula',formula:'SOMA_SE(Menções; Marca; "M&F") / SOMA(Menções) * 100',groupBy:'Data',gran:'semana',viz:'linha',format:'pct',target:'40',wide:true},
      {...B,name:'Menções por marca',mode:'simples',agg:'soma',col:'Menções',groupBy:'Marca',viz:'rosca'},
      {...B,name:'Menções negativas por fonte',mode:'simples',agg:'soma',col:'Menções',groupBy:'Fonte',viz:'hbar',lower:true,filters:[...MF,{col:'Sentimento',op:'=',val:'Negativo'}]},
      {...B,name:'Sentimento por fonte',mode:'formula',formula:'SOMA_SE(Menções; Sentimento; "Positivo") / SOMA(Menções) * 100',groupBy:'Fonte',viz:'tabela',format:'pct',target:'60',filters:MF}
    ]};
  },
  growth(){
    const r=rng(41),rows=[];
    const CAN={'Orgânico':[900,.035,0],'Mídia paga':[1300,.028,1.0],'Indicação':[180,.09,0.05],'Eventos':[120,.12,.6],'Outbound':[260,.05,.35]};
    eachDay(92,(d,i)=>{for(const[c,[v,lr,cost]]of Object.entries(CAN)){
      const vis=Math.round(v*(.7+r()*.6)*(1+i/200));const leads=Math.round(vis*lr*(.7+r()*.6));const mql=Math.round(leads*(.45+r()*.2));
      const sql=Math.round(mql*(.35+r()*.2)*(c==='Indicação'?1.4:1));const cli=Math.round(sql*(.2+r()*.15));
      rows.push({Data:isoDay(d),'Canal de aquisição':c,Visitantes:vis,Leads:leads,MQL:mql,SQL:sql,Clientes:cli,Investimento:R2(vis*cost*(.8+r()*.4)+(c==='Outbound'?180:0)),Receita:Math.round(cli*(3200+r()*2600))})}});
    const B={filters:[],gran:'mes',limit:10,decimals:'',target:'',lower:false,wide:false};
    return{name:'exemplo_growth.xlsx',rows,ind:[
      {...B,name:'Novos clientes',mode:'simples',agg:'soma',col:'Clientes',groupBy:'Data',viz:'kpi'},
      {...B,name:'CAC',mode:'formula',formula:'SOMA(Investimento) / SOMA(Clientes)',groupBy:'Data',viz:'kpi',format:'moeda',target:'250',lower:true},
      {...B,name:'Conversão lead → cliente',mode:'formula',formula:'SOMA(Clientes) / SOMA(Leads) * 100',groupBy:'Data',viz:'kpi',format:'pct',target:'4'},
      {...B,name:'Receita nova',mode:'simples',agg:'soma',col:'Receita',groupBy:'Data',viz:'kpi',format:'moeda'},
      {...B,name:'Funil de aquisição',mode:'etapas',steps:['Visitantes','Leads','MQL','SQL','Clientes'],groupBy:'',viz:'funil',wide:true},
      {...B,name:'CAC por canal',mode:'formula',formula:'SOMA(Investimento) / SOMA(Clientes)',groupBy:'Canal de aquisição',viz:'hbar',format:'moeda',target:'250',lower:true},
      {...B,name:'Leads por semana',mode:'simples',agg:'soma',col:'Leads',groupBy:'Data',gran:'semana',viz:'area',wide:true},
      {...B,name:'Conversão por canal',mode:'formula',formula:'SOMA(Clientes) / SOMA(Leads) * 100',groupBy:'Canal de aquisição',viz:'tabela',format:'pct',target:'4'}
    ]};
  },
  interna(){
    const r=rng(51),rows=[];
    const CAN={'E-mail':[.52,.18],'Intranet':[.38,.22],'WhatsApp':[.81,.09],'Mural digital':[.6,.02]};
    const AREA=['RH','Operações','Diretoria','TI','Marketing','Jurídico'];
    const TIT={RH:['Benefícios 2027','Campanha de vacinação','Pesquisa de clima'],'Operações':['Nova rota de leitura','Segurança em campo','Metas do trimestre'],Diretoria:['Resultado do trimestre','Recado do CEO'],TI:['Troca de senha','Novo sistema de chamados'],Marketing:['Lançamento de produto','Radar de Soluções'],'Jurídico':['Código de conduta','LGPD na prática']};
    eachDay(92,(d)=>{if(d.getDay()===0||d.getDay()===6)return;const n=r()<.5?1:r()<.7?2:0;for(let k=0;k<n;k++){
      const area=AREA[Math.floor(r()*AREA.length)],canal=Object.keys(CAN)[Math.floor(r()*4)],[ab,ck]=CAN[canal];
      const evento=r()<.12;const env=Math.round(800+r()*1600);const abertos=Math.round(env*ab*(.75+r()*.4)*(area==='Diretoria'?1.15:1));
      const tit=TIT[area][Math.floor(r()*TIT[area].length)];const conv=evento?Math.round(60+r()*240):'';
      rows.push({Data:isoDay(d),Tipo:evento?'Evento':'Comunicado','Título':evento?'Encontro: '+tit:tit,Canal:canal,'Área':area,Enviados:env,Abertos:Math.min(env,abertos),Cliques:Math.round(abertos*ck*(.6+r()*.8)),'Reações':Math.round(abertos*(.03+r()*.06)),Convidados:conv,Participantes:evento?Math.round(conv*(.45+r()*.4)):''})}});
    const B={filters:[],gran:'mes',limit:10,decimals:'',target:'',lower:false,wide:false};
    return{name:'exemplo_comunicacao_interna.xlsx',rows,ind:[
      {...B,name:'Comunicados enviados',mode:'simples',agg:'contar',col:'',groupBy:'Data',viz:'kpi'},
      {...B,name:'Taxa de abertura',mode:'formula',formula:'SOMA(Abertos) / SOMA(Enviados) * 100',groupBy:'Data',viz:'kpi',format:'pct',target:'60'},
      {...B,name:'Taxa de clique',mode:'formula',formula:'SOMA(Cliques) / SOMA(Abertos) * 100',groupBy:'Data',viz:'kpi',format:'pct',target:'12'},
      {...B,name:'Participação em eventos',mode:'formula',formula:'SOMA(Participantes) / SOMA(Convidados) * 100',groupBy:'Data',viz:'kpi',format:'pct',target:'70',filters:[{col:'Tipo',op:'=',val:'Evento'}]},
      {...B,name:'Abertura por canal',mode:'formula',formula:'SOMA(Abertos) / SOMA(Enviados) * 100',groupBy:'Canal',viz:'hbar',format:'pct',target:'60'},
      {...B,name:'Comunicados por mês',mode:'simples',agg:'contar',col:'',groupBy:'Data',viz:'bar'},
      {...B,name:'Engajamento por área',mode:'formula',formula:'SOMA(Abertos) / SOMA(Enviados) * 100',groupBy:'Área',viz:'tabela',format:'pct',target:'60',wide:true}
    ]};
  }
};
function loadSamples(){
  S.sources=S.sources.filter(x=>!x.sample);S.indicators=S.indicators.filter(i=>src(i.sourceId));
  let first=null;
  for(const area of ['social','trafego','brand','growth','interna']){
    const def=SAMPLES[area]();const s=buildSource(def.name,'',def.rows);s.sample=true;s.area=area;S.sources.push(s);if(!first)first=s.id;
    for(const ind of def.ind)S.indicators.push({...ind,id:uid(),sourceId:s.id});
  }
  S.active=first;S.sampleVer=SAMPLE_VER;S.tab='dash';save();renderAll();toast('Planilhas de exemplo carregadas');
}
$('#restoreBtn').onclick=loadSamples;
$('#areaSel').addEventListener('change',e=>{const s=activeSrc();if(!s)return;s.area=e.target.value;save();renderSide();toast(`Planilha movida para ${AREAS[s.area].nome}`)});

/* ============ início ============ */
if(!load()||!S.sources.length||S.sampleVer!==SAMPLE_VER)loadSamples();else renderAll();
</script>
