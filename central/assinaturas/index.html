// ---------- Mini line chart (no external chart library) ----------
function LineChartSVG({ data, color, darkMode }) {
  const w = 600, h = 220, padding = 30;
  const values = data.map((d) => d.geradas);
  const max = Math.max(...values) || 1;
  const stepX = (w - padding * 2) / (data.length - 1);
  const scaleY = (v) => h - padding - (v / max) * (h - padding * 2);
  const points = data.map((d, i) => `${padding + i * stepX},${scaleY(d.geradas)}`).join(" ");
  const gridColor = darkMode ? "#0B5050" : "#E2DBC6";
  const textColor = darkMode ? "#9BB5AB" : "#6B7B76";

  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full" preserveAspectRatio="none">
      <defs>
        <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.25" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <line key={f} x1={padding} x2={w - padding} y1={padding + f * (h - padding * 2)} y2={padding + f * (h - padding * 2)} stroke={gridColor} strokeWidth="1" />
      ))}
      <polygon points={`${padding},${h - padding} ${points} ${w - padding},${h - padding}`} fill="url(#areaFill)" stroke="none" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {data.map((d, i) => (
        <circle key={i} cx={padding + i * stepX} cy={scaleY(d.geradas)} r="3" fill={color}>
          <title>{`${d.dia}: ${d.geradas}`}</title>
        </circle>
      ))}
      {data.map((d, i) => (
        i % 2 === 0 ? <text key={"t" + i} x={padding + i * stepX} y={h - 8} fontSize="10" fill={textColor} textAnchor="middle">{d.dia}</text> : null
      ))}
    </svg>
  );
}

const STATUS_LABEL_TO_DB = { Pendente: "pendente", Gerada: "enviada", Erro: "erro" };
const TIPO_DB_TO_LABEL = { sucesso: "Sucesso", erro: "Erro", info: "Info" };

function formatarData(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
}
function formatarHora(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
}

// Cada linha de `assinaturas` já representa um colaborador (o Monday.com é a
// fonte de colaboradores — não existe tabela separada). As telas de
// Colaboradores e Assinaturas leem os mesmos registros, só mostram colunas
// diferentes.
function mapRegistroFromDb(row) {
  return {
    id: row.id,
    mondayId: row.monday_id,
    nome: row.nome,
    cargo: row.cargo,
    email: row.email,
    empresa: row.empresa || "",
    telefone: row.telefone || "",
    foto: row.foto,
    png_url: row.png_url,
    htmlAssinatura: row.html_assinatura,
    status: row.status === "erro" ? "Erro" : (row.html_assinatura ? "Gerada" : "Pendente"),
    atualizado: formatarData(row.ultima_atualizacao),
    data: formatarData(row.ultima_atualizacao),
    dataCriacaoRaw: row.data_criacao,
  };
}

function mapLogFromDb(row) {
  return {
    id: row.id,
    tipo: TIPO_DB_TO_LABEL[row.tipo] || row.tipo,
    descricao: row.descricao,
    usuario: row.usuario,
    data: `${formatarData(row.data)} ${formatarHora(row.data)}`,
    dataRaw: row.data,
  };
}

// Monta os últimos 14 dias (mesmo os sem nenhuma assinatura gerada) contando
// quantos registros de `assinaturas` foram criados em cada um.
function calcularEvolucaoDiaria(registros) {
  const dias = [];
  const hoje = new Date();
  for (let i = 13; i >= 0; i--) {
    const d = new Date(hoje);
    d.setDate(d.getDate() - i);
    dias.push({ chave: `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`, geradas: 0 });
  }
  registros.forEach((r) => {
    if (!r.dataCriacaoRaw) return;
    const d = new Date(r.dataCriacaoRaw);
    const chave = `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}`;
    const item = dias.find((x) => x.chave === chave);
    if (item) item.geradas++;
  });
  return dias.map((d) => ({ dia: d.chave, geradas: d.geradas }));
}

// Histórico é uma leitura mais amigável da própria tabela `logs`, agrupada por dia.
function historicoFromLogs(logs) {
  return logs.map((l) => ({
    id: l.id,
    data: formatarData(l.dataRaw),
    hora: formatarHora(l.dataRaw),
    evento: l.descricao,
    colaborador: l.usuario,
  }));
}

const LARGURA_FOTO = 170;
const ALTURA_FOTO = 170;

function formatarTelefone(tel) {
  if (!tel) return "";
  const d = String(tel).replace(/\D/g, "");
  const n = d.startsWith("55") && d.length >= 12 ? d.slice(2) : d;
  if (n.length === 11) return `(${n.slice(0, 2)}) ${n.slice(2, 7)}-${n.slice(7)}`;
  if (n.length === 10) return `(${n.slice(0, 2)}) ${n.slice(2, 6)}-${n.slice(6)}`;
  return tel;
}

};
const ADV = { fotoLargura: 208, textoX: 235, textoMax: 425, cor: "#000000" };

function modeloPadrao(colab) {
  return /advog/i.test((colab && colab.empresa) || "") ? "advogados" : "cobranca";
}

async function carregarImagem(src) {
  const img = new Image();
  img.src = src;
  await img.decode();
  return img;
}

const BUCKET_FOTOS = "fotos-colaboradores";

async function carregarFoto(url) {
  if (!url) return null;
  try {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = url;
    await img.decode();
    return img;
  } catch (e) {
    return null;
  }
}

async function prepararFoto(img) {
  const max = 800;
  const r = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
  const g = c.getContext("2d");
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("falha ao preparar a foto"))), "image/jpeg", 0.9));
}

async function salvarFotoColaborador(colab, blob) {
  const caminho = `manual/${colab.id}-${Date.now()}.jpg`;
  const { error } = await sb.storage.from(BUCKET_FOTOS).upload(caminho, blob, { contentType: "image/jpeg", upsert: false });
  if (error) throw error;
  const { data } = sb.storage.from(BUCKET_FOTOS).getPublicUrl(caminho);
  const { error: e2 } = await sb.from("assinaturas").update({ foto: data.publicUrl }).eq("id", colab.id);
  if (e2) throw e2;
  return data.publicUrl;
}

// Foto na faixa da esquerda, altura toda — igual nos dois modelos.
function desenharFotoFaixa(ctx, foto, W, H) {
  const r = Math.max(W / foto.width, H / foto.height);
  const w = foto.width * r, h = foto.height * r;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.drawImage(foto, (W - w) / 2, (H - h) / 2, w, h);
  ctx.restore();
}

async function desenharAdvogados(ctx, colab, foto) {
  ctx.drawImage(await carregarImagem(SIG_BG_ADV), 0, 0, 1000, 250);
  if (foto) desenharFotoFaixa(ctx, foto, ADV.fotoLargura, 250);
  try {
    await Promise.all([document.fonts.load("700 25px Montserrat"), document.fonts.load("500 25px Montserrat"), document.fonts.load("400 17px Montserrat")]);
  } catch (e) { /* segue com a fonte reserva */ }
  const fam = "Montserrat, 'Segoe UI', Arial, sans-serif";
  const tel = formatarTelefone(colab.telefone);
  const x = ADV.textoX, max = ADV.textoMax;
  ctx.fillStyle = ADV.cor;
  ctx.textBaseline = "alphabetic";
  ctx.font = `700 25px ${fam}`; ctx.fillText(String(colab.nome || "").toUpperCase(), x, 41, max);
  ctx.font = `400 17px ${fam}`; ctx.fillText(String(colab.cargo || "").toUpperCase(), x, 65, max);
  if (tel) {
    ctx.font = `500 25px ${fam}`; ctx.fillText(tel, x, 119, max);
    ctx.font = `400 17px ${fam}`; ctx.fillText(colab.email || "", x, 145, max);
  } else {
    ctx.font = `500 21px ${fam}`; ctx.fillText(colab.email || "", x, 119, max);
  }
}

  const telFmt = formatarTelefone(colab.telefone);

// Gera a assinatura como imagem PNG direto no navegador — mesmo
// layout aprovado: fundo da marca + nome/cargo/telefone/e-mail.
async function gerarAssinaturaPNGBlob(colab, opts = {}) {
  const modelo = opts.modelo || modeloPadrao(colab);
  const foto = opts.foto !== undefined ? opts.foto : await carregarFoto(colab.foto);
  if (modelo === "advogados") {
    const c = document.createElement("canvas");
    c.width = MODELOS.advogados.largura; c.height = MODELOS.advogados.altura;
    await desenharAdvogados(c.getContext("2d"), colab, foto);
    return new Promise((resolve, reject) => c.toBlob((b) => (b ? resolve(b) : reject(new Error("falha ao gerar PNG"))), "image/png"));
  }
  const desloc = foto ? ADV.fotoLargura : 0; // mesma faixa de foto dos Advogados
  const W = 792 + desloc, H = 250;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.src = SIG_BG;
  await img.decode();
  ctx.drawImage(img, desloc, 0, 792, H);
  if (foto) desenharFotoFaixa(ctx, foto, ADV.fotoLargura, H);
  const tx = desloc + 40;
  const tmax = 460;
  try {
    await Promise.all([document.fonts.load("700 24px Poppins"), document.fonts.load("400 15px Poppins")]);
  } catch (e) { /* segue com a fonte reserva */ }
  const fam = "Poppins, 'Segoe UI', Arial, sans-serif";
  const tel = formatarTelefone(colab.telefone);
  ctx.fillStyle = SIG_TEXT;
  ctx.textBaseline = "alphabetic";
  ctx.font = `700 24px ${fam}`; ctx.fillText(colab.nome || "", tx, 44, tmax);
  ctx.font = `400 15px ${fam}`; ctx.fillText(colab.cargo || "", tx, 66, tmax);
  if (tel) {
    ctx.font = `700 23px ${fam}`; ctx.fillText(tel, tx, 115, tmax);
    ctx.font = `400 15px ${fam}`; ctx.fillText(colab.email || "", tx, 137, tmax);
  } else {
    ctx.font = `700 23px ${fam}`; ctx.fillText(colab.email || "", tx, 115, tmax);
  }
  return new Promise((resolve, reject) => canvas.toBlob((b) => (b ? resolve(b) : reject(new Error("falha ao gerar PNG"))), "image/png"));
}

async function baixarAssinaturaPNG(colab, opts = {}) {
  const blob = await gerarAssinaturaPNGBlob(colab, opts);
  const slug = String(colab.nome || "assinatura").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `assinatura-${slug}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function generateSignatureHTML(colab, modelo) {
  if ((modelo || modeloPadrao(colab)) === "advogados") return generateSignatureHTMLAdv(colab);
  const telFmt = formatarTelefone(colab.telefone);
  const temFoto = Boolean(colab.foto);
  const desloc = temFoto ? ADV.fotoLargura : 0; // mesma faixa de foto dos Advogados
  const left = desloc + 40;
  const fotoHtml = temFoto
    ? `<img src="${colab.foto}" width="${ADV.fotoLargura}" height="250" style="position:absolute;left:0;top:0;width:${ADV.fotoLargura}px;height:250px;object-fit:cover;" />`
    : "";
  const emailHtml = `<a href="mailto:${colab.email}" style="color:${SIG_TEXT};text-decoration:none;">${colab.email}</a>`;
  const telefoneHtml = telFmt
    ? `<a href="tel:${telFmt}" style="color:${SIG_TEXT};text-decoration:none;">${telFmt}</a>`
    : "";
  const segundoBloco = telFmt
    ? `<div style="font-size:23px;font-weight:700;color:${SIG_TEXT};line-height:1.2;">${telefoneHtml}</div>
    <div style="font-size:15px;font-weight:400;color:${SIG_TEXT};margin-top:3px;">${emailHtml}</div>`
    : `<div style="font-size:23px;font-weight:700;color:${SIG_TEXT};line-height:1.2;">${emailHtml}</div>`;
  const larg = 792 + desloc;
  return `<div style="width:${larg}px;max-width:${larg}px;height:250px;position:relative;overflow:hidden;background-image:url('${SIG_BG}');background-size:792px 250px;background-position:${desloc}px 0;background-repeat:no-repeat;font-family:'Poppins','Segoe UI',Arial,sans-serif;">
  ${fotoHtml}
  <div style="position:absolute;left:${left}px;top:26px;">
    <div style="font-size:24px;font-weight:700;color:${SIG_TEXT};line-height:1.2;">${colab.nome}</div>
    <div style="font-size:15px;font-weight:400;color:${SIG_TEXT};margin-top:3px;">${colab.cargo}</div>
  </div>

  <div style="position:absolute;left:${left}px;top:96px;">
    ${segundoBloco}
  </div>
</div>`;
}

function downloadHTML(colab, modelo) {
  const inner = generateSignatureHTML(colab, modelo);
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8" /><style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&family=Montserrat:wght@400;500;700&display=swap');</style></head><body style="margin:0;padding:24px;background:#ffffff;">${inner}</body></html>`;
  const blob = new Blob([html], { type: "text/html" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `assinatura-${colab.nome.toLowerCase().replace(/\s+/g, "-")}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function PreviewModal({ colaborador, assinatura, onClose, onRegenerar, onEnviarRevisao, onGerar, onBaixar, onFotoAlterada, loading, t }) {
  const [copied, setCopied] = useState(false);
  const [modelo, setModelo] = useState(() => modeloPadrao(colaborador));
  const [foto, setFoto] = useState(null);
  const [fotoErro, setFotoErro] = useState("");
  const [fotoAviso, setFotoAviso] = useState("");
  const [salvandoFoto, setSalvandoFoto] = useState(false);
  const [confirmarRemocao, setConfirmarRemocao] = useState(false);
  const [previewUrl, setPreviewUrl] = useState("");

  useEffect(() => { setModelo(modeloPadrao(colaborador)); setFotoErro(""); setFotoAviso(""); setConfirmarRemocao(false); }, [colaborador && colaborador.id]);

  useEffect(() => {
    let ativo = true;
    setFoto(null);
    carregarFoto(colaborador && colaborador.foto).then((img) => { if (ativo) setFoto(img); });
    return () => { ativo = false; };
  }, [colaborador && colaborador.id, colaborador && colaborador.foto]);

  useEffect(() => {
    if (!colaborador) { setPreviewUrl(""); return; }
    let ativo = true, url = "";
    gerarAssinaturaPNGBlob(colaborador, { modelo, foto }).then((b) => {
      if (!ativo) return;
      url = URL.createObjectURL(b);
      setPreviewUrl(url);
    }).catch(() => {});
    return () => { ativo = false; if (url) URL.revokeObjectURL(url); };
  }, [colaborador, modelo, foto]);

  if (!colaborador) return null;

  const escolherFoto = async (e) => {
    const arquivo = e.target.files && e.target.files[0];
    e.target.value = "";
    setFotoErro("");
    if (!arquivo) return;
    setFotoAviso("");
    if (!/^image\//.test(arquivo.type)) { setFotoErro("Escolha um arquivo de imagem (JPG ou PNG)."); return; }
    let img;
    try {
      img = await carregarImagem(URL.createObjectURL(arquivo));
    } catch (err) {
      setFotoErro("Não foi possível abrir essa imagem.");
      return;
    }
    setFoto(img);
    setSalvandoFoto(true);
    try {
      const url = await salvarFotoColaborador(colaborador, await prepararFoto(img));
      setFotoAviso("Foto salva para este colaborador.");
      if (onFotoAlterada) onFotoAlterada(colaborador.id, url);
    } catch (err) {
      setFotoErro("A foto entrou só neste download. Para salvar, falta liberar o envio de fotos no Supabase.");
    }
    setSalvandoFoto(false);
  };

  const removerFoto = async () => {
    setConfirmarRemocao(false);
    setFotoErro(""); setFotoAviso("");
    setFoto(null);
    const { error } = await sb.from("assinaturas").update({ foto: null }).eq("id", colaborador.id);
    if (error) { setFotoErro("Não foi possível remover a foto salva."); return; }
    setFotoAviso("Foto removida.");
    if (onFotoAlterada) onFotoAlterada(colaborador.id, null);
  };

  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(generateSignatureHTML(colaborador, modelo));
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (e) {
      setCopied(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
      <div className={`w-full max-w-3xl rounded-2xl border shadow-2xl ${t.panel} ${t.border} max-h-[90vh] flex flex-col`}>
        <div className={`flex items-center justify-between px-5 py-4 border-b ${t.border} shrink-0`}>
          <div>
            <h3 className={`text-sm font-semibold ${t.text}`}>Preview da assinatura</h3>
            <p className={`text-xs ${t.subtext}`}>{colaborador.nome}</p>
          </div>
          <button onClick={onClose} className={`p-1.5 rounded-lg ${t.hover}`}>
            <Icon name="x" size={18} className={t.text} />
          </button>
        </div>

        <div className="p-5 overflow-y-auto space-y-4">
          {!assinatura ? (
            <div className={`text-center py-10 ${t.subtext}`}>
              <Icon name="file-signature" size={28} className="mx-auto mb-3 opacity-50" />
              <p className="text-sm mb-4">Nenhuma assinatura gerada ainda para este colaborador.</p>
              <button onClick={() => onGerar(colaborador)} className="px-4 py-2 rounded-lg text-sm font-medium text-white" style={{ background: BRAND_GREEN }}>
                Gerar agora
              </button>
            </div>
          ) : (
            <>
              <div className="rounded-xl border border-[#E2DBC6] overflow-hidden">
                <div className="bg-white p-5">
                  {loading ? (
                    <div className="flex items-center gap-2 text-gray-400 text-sm py-6">
                      <Icon name="loader-2" size={16} className="animate-spin" /> Gerando assinatura...
                    </div>
                  ) : (
                    previewUrl
                      ? <img src={previewUrl} alt={`Assinatura de ${colaborador.nome}`} style={{ width: "100%", maxWidth: 1000, height: "auto", display: "block" }} />
                      : <div className="flex items-center gap-2 text-gray-400 text-sm py-6"><Icon name="loader-2" size={16} className="animate-spin" /> Montando prévia...</div>
                  )}
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <span className={`text-xs font-semibold ${t.text}`}>Modelo</span>
                <div className={`inline-flex rounded-lg border overflow-hidden ${t.border}`}>
                  {Object.entries(MODELOS).map(([chave, m]) => (
                    <button key={chave} onClick={() => setModelo(chave)} className={`px-3 py-1.5 text-xs font-semibold ${modelo === chave ? "text-white" : t.text}`} style={modelo === chave ? { background: BRAND_GREEN } : {}}>
                      {m.rotulo}
                    </button>
                  ))}
                </div>
                <div className="flex items-center gap-2">
                  <label className={`cursor-pointer px-3 py-1.5 rounded-lg border text-xs font-semibold ${t.text} ${t.border} ${t.hover}`}>
                    {salvandoFoto ? "Salvando..." : foto ? "Trocar foto" : "Enviar foto"}
                    <input id="foto-colaborador" type="file" accept="image/*" className="hidden" onChange={escolherFoto} disabled={salvandoFoto} />
                  </label>
                  {foto && !salvandoFoto && !confirmarRemocao && <button onClick={() => setConfirmarRemocao(true)} className={`text-xs font-semibold ${t.subtext}`}>Remover foto</button>}
                  {confirmarRemocao && (
                    <span className="flex items-center gap-2 text-xs">
                      <span className={t.text}>Remover a foto de {colaborador.nome.split(" ")[0]}?</span>
                      <button onClick={removerFoto} className="px-2 py-1 rounded-md font-semibold text-white" style={{ background: "#B91C1C" }}>Sim, remover</button>
                      <button onClick={() => setConfirmarRemocao(false)} className={`px-2 py-1 rounded-md font-semibold border ${t.text} ${t.border}`}>Cancelar</button>
                    </span>
                  )}
                </div>
              </div>
              <p className={`text-xs ${fotoErro ? "text-red-600" : t.subtext}`}>
                {fotoErro || fotoAviso || (foto ? "Foto salva deste colaborador." : "Sem foto. Envie uma foto vertical, com o rosto centralizado: ela ocupa a faixa da esquerda e fica salva para as próximas vezes.")}
              </p>

              <div className="grid grid-cols-2 gap-2">
                <button onClick={() => onRegenerar(colaborador)} className={`col-span-2 order-last flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>
                  <Icon name="refresh-cw" size={14} /> Regenerar
                </button>
                <button onClick={() => onBaixar(colaborador, { modelo, foto })} className="col-span-2 flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg text-sm font-semibold text-white" style={{ background: BRAND_GREEN }}>
                  <Icon name="download" size={14} /> Baixar assinatura (PNG)
                </button>
                <button onClick={() => downloadHTML(colaborador, modelo)} className={`flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>
                  <Icon name="download" size={14} /> Baixar HTML
                </button>
                <button onClick={handleCopy} className={`flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-sm font-medium border ${t.text} ${t.border} ${t.hover}`}>
                  <Icon name={copied ? "check" : "copy"} size={14} style={copied ? { color: BRAND_GREEN } : {}} /> {copied ? "Copiado!" : "Copiar HTML"}
                </button>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

          <div className="titulo-marca" style={{ color: BRAND_MID, fontSize: 11 }}>Gerador de assinaturas</div>
          <h1 className="titulo-marca mt-1" style={{ color: BRAND_DARK, fontSize: 22 }}>{titulo}</h1>
          {subtitulo && <p className="text-sm mt-1" style={{ color: "#4d6461" }}>{subtitulo}</p>}
          <div className="mt-5">{children}</div>
        </div>
        <p className="text-center text-[11px] mt-6" style={{ color: "rgba(239,234,221,0.55)" }}>Acesso restrito à equipe Meireles &amp; Freitas</p>
      </div>
    </div>
  );
}

function CampoAcesso({ id, label, ...props }) {
  return (
    <div>
      <label htmlFor={id} className="block text-xs font-semibold mb-1.5" style={{ color: BRAND_DARK }}>{label}</label>
      <input id={id} {...props} className="w-full px-3 py-2.5 rounded-lg border text-sm outline-none focus:ring-2" style={{ borderColor: "#D9D2BF", background: "#fff", color: BRAND_DARK, "--tw-ring-color": BRAND_LIME }} />
    </div>
  );
}

function MensagemAcesso({ tipo, children }) {
  if (!children) return null;
  const erro = tipo === "erro";
  return (
    <div role={erro ? "alert" : "status"} className="text-xs rounded-lg px-3 py-2" style={{ background: erro ? "#FEF2F2" : "#EDF2D8", color: erro ? "#991B1B" : BRAND_GREEN }}>
      {children}
    </div>
  );
}

function BotaoAcesso({ carregando, children, ...props }) {
  return (
    <button {...props} disabled={carregando || props.disabled} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-bold text-white disabled:opacity-60" style={{ background: BRAND_GREEN }}>
      {carregando && <Icon name="loader-2" size={15} className="animate-spin" />} {children}
    </button>
  );
}

function LoginScreen() {
  const [modo, setModo] = useState("entrar"); // entrar | recuperar
  const [email, setEmail] = useState("");
  const [senha, setSenha] = useState("");
  const [erro, setErro] = useState("");
  const [aviso, setAviso] = useState("");
  const [carregando, setCarregando] = useState(false);
  const [falhas, setFalhas] = useState(0);
  const [bloqueadoAte, setBloqueadoAte] = useState(0);

  const entrar = async (e) => {
    e.preventDefault();
    setErro(""); setAviso("");
    if (Date.now() < bloqueadoAte) {
      setErro("Muitas tentativas seguidas. Aguarde um minuto e tente de novo.");
      return;
    }
    setCarregando(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: senha });
    setCarregando(false);
    if (error) {
      const n = falhas + 1;
      if (n >= MAX_TENTATIVAS) { setBloqueadoAte(Date.now() + ESPERA_BLOQUEIO_MS); setFalhas(0); }
      else setFalhas(n);
      setSenha("");
      setErro(/confirm/i.test(error.message) ? "Este e-mail ainda não foi confirmado. Confira sua caixa de entrada." : "E-mail ou senha incorretos.");
    }
  };

  const recuperar = async (e) => {
    e.preventDefault();
    setErro(""); setAviso("");
    if (!email.trim()) { setErro("Informe seu e-mail."); return; }
    setCarregando(true);
    await sb.auth.resetPasswordForEmail(email.trim(), { redirectTo: window.location.origin + window.location.pathname });
    setCarregando(false);
    // Mesma mensagem sempre: não revela se o e-mail tem acesso ou não.
    setAviso("Se este e-mail tiver acesso, você vai receber um link para criar uma nova senha.");
  };

  if (modo === "recuperar") {
    return (
      <TelaAcesso titulo="Recuperar senha" subtitulo="Enviamos um link para você criar uma nova senha.">
        <form onSubmit={recuperar} className="space-y-4">
          <CampoAcesso id="rec-email" label="E-mail" type="email" autoComplete="email" required value={email} onChange={(e) => setEmail(e.target.value)} />
          <MensagemAcesso tipo="erro">{erro}</MensagemAcesso>
          <MensagemAcesso>{aviso}</MensagemAcesso>
          <BotaoAcesso type="submit" carregando={carregando}>Enviar link</BotaoAcesso>
          <button type="button" onClick={() => { setModo("entrar"); setErro(""); setAviso(""); }} className="w-full text-xs font-semibold" style={{ color: BRAND_GREEN }}>← Voltar para o login</button>
        </form>
      </TelaAcesso>
    );
  }

  return (
    <TelaAcesso titulo="Entrar" subtitulo="Use o e-mail e a senha do seu acesso.">
      <form onSubmit={entrar} className="space-y-4">
        <CampoAcesso id="login-email" label="E-mail" type="email" autoComplete="username" required value={email} onChange={(e) => setEmail(e.target.value)} />
        <CampoAcesso id="login-senha" label="Senha" type="password" autoComplete="current-password" required value={senha} onChange={(e) => setSenha(e.target.value)} />
        <MensagemAcesso tipo="erro">{erro}</MensagemAcesso>
        <BotaoAcesso type="submit" carregando={carregando}><Icon name="lock" size={14} /> Entrar</BotaoAcesso>
        <button type="button" onClick={() => { setModo("recuperar"); setErro(""); }} className="w-full text-xs font-semibold" style={{ color: BRAND_GREEN }}>Esqueci minha senha</button>
      </form>
    </TelaAcesso>
  );
}

function NovaSenhaScreen({ onConcluir }) {
  const [senha, setSenha] = useState("");
  const [confirma, setConfirma] = useState("");
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  const salvar = async (e) => {
    e.preventDefault();
    setErro("");
    if (senha.length < 10) { setErro("A senha precisa ter pelo menos 10 caracteres."); return; }
    if (!/[A-Za-z]/.test(senha) || !/[0-9]/.test(senha)) { setErro("Use letras e números na senha."); return; }
    if (senha !== confirma) { setErro("As duas senhas não são iguais."); return; }
    setCarregando(true);
    const { error } = await sb.auth.updateUser({ password: senha });
    setCarregando(false);
    if (error) { setErro("Não foi possível salvar a senha. Peça um novo link e tente de novo."); return; }
    onConcluir();
  };

  return (
    <TelaAcesso titulo="Nova senha" subtitulo="Pelo menos 10 caracteres, com letras e números.">
      <form onSubmit={salvar} className="space-y-4">
        <CampoAcesso id="nova-senha" label="Nova senha" type="password" autoComplete="new-password" required value={senha} onChange={(e) => setSenha(e.target.value)} />
        <CampoAcesso id="nova-senha-2" label="Repita a nova senha" type="password" autoComplete="new-password" required value={confirma} onChange={(e) => setConfirma(e.target.value)} />
        <MensagemAcesso tipo="erro">{erro}</MensagemAcesso>
        <BotaoAcesso type="submit" carregando={carregando}>Salvar e entrar</BotaoAcesso>
      </form>
    </TelaAcesso>
  );
}

function SemAcessoScreen({ email }) {
  return (
    <TelaAcesso titulo="Acesso não liberado" subtitulo={`O e-mail ${email} ainda não tem permissão para usar o gerador. Peça a liberação para a equipe de Produtos.`}>
      <BotaoAcesso type="button" onClick={() => sb.auth.signOut()}><Icon name="log-out" size={14} /> Sair</BotaoAcesso>
    </TelaAcesso>
  );
}

function Carregando() {
  return (
    <div className="min-h-screen flex items-center justify-center gap-2 text-sm" style={{ background: BRAND_DARK, color: BRAND_CREAM }}>
      <Icon name="loader-2" size={18} className="animate-spin" /> Carregando...
    </div>
  );
}

function Root() {
  const [sessao, setSessao] = useState(undefined);
  const [recuperando, setRecuperando] = useState(false);
  const [autorizado, setAutorizado] = useState(null);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSessao(data.session || null));
    const { data } = sb.auth.onAuthStateChange((evento, s) => {
      if (evento === "PASSWORD_RECOVERY") setRecuperando(true);
      setSessao(s || null);
    });
    return () => data.subscription.unsubscribe();
  }, []);

  const userId = sessao && sessao.user ? sessao.user.id : null;

  // Confere se o e-mail está na lista de autorizados (quando a lista existir no banco).
  useEffect(() => {
    if (!userId) { setAutorizado(null); return; }
    let ativo = true;
    sb.rpc("usuario_autorizado").then(({ data, error }) => {
      if (!ativo) return;
      setAutorizado(error ? true : data === true); // sem a função no banco, vale a regra do banco
    });
    return () => { ativo = false; };
  }, [userId]);

  // Sai sozinho depois de um tempo sem uso.
  useEffect(() => {
    if (!userId) return;
    let timer;
    const reiniciar = () => { clearTimeout(timer); timer = setTimeout(() => sb.auth.signOut(), TEMPO_MAX_INATIVO_MS); };
    const eventos = ["mousedown", "keydown", "touchstart", "scroll"];
    eventos.forEach((ev) => window.addEventListener(ev, reiniciar, { passive: true }));
    reiniciar();
    return () => { clearTimeout(timer); eventos.forEach((ev) => window.removeEventListener(ev, reiniciar)); };
  }, [userId]);

  if (sessao === undefined) return <Carregando />;
  if (recuperando && sessao) return <NovaSenhaScreen onConcluir={() => setRecuperando(false)} />;
  if (!sessao) return <LoginScreen />;
  if (autorizado === null) return <Carregando />;
  if (!autorizado) return <SemAcessoScreen email={sessao.user.email} />;
  return <App usuario={sessao.user.email} onSair={() => sb.auth.signOut()} />;
}


function App({ usuario, onSair }) {
  const [page, setPage] = useState("dashboard");
  const [darkMode, setDarkMode] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [toast, setToast] = useState(null);

  const [registros, setRegistros] = useState([]);
  const [logs, setLogs] = useState([]);
  const [carregandoDados, setCarregandoDados] = useState(true);
  const [search, setSearch] = useState("");

  const [generatingId, setGeneratingId] = useState(null);
  const [previewColab, setPreviewColab] = useState(null);
  const [previewLoading, setPreviewLoading] = useState(false);
  const [editColab, setEditColab] = useState(null);

  const t = useTheme(darkMode);

  const carregarDados = async () => {
    setCarregandoDados(true);
    const [{ data: assinaturasData, error: e1 }, { data: logsData, error: e2 }] = await Promise.all([
      sb.from("assinaturas").select("*").order("ultima_atualizacao", { ascending: false }),
      sb.from("logs").select("*").order("data", { ascending: false }).limit(50),
    ]);
    if (e1) console.error("Erro ao buscar assinaturas:", e1.message);
    if (e2) console.error("Erro ao buscar logs:", e2.message);
    setRegistros((assinaturasData || []).map(mapRegistroFromDb));
    setLogs((logsData || []).map(mapLogFromDb));
    setCarregandoDados(false);
  };

  useEffect(() => {
    carregarDados();
  }, []);

  useEffect(() => {
    if (!toast) return;
    const timer = setTimeout(() => setToast(null), 3000);
    return () => clearTimeout(timer);
  }, [toast]);

  const notify = (msg, type) => setToast({ msg, type: type || "success" });

  const registrarLog = async (descricao, tipo) => {
    await sb.from("logs").insert({ tipo: tipo || "sucesso", descricao, usuario: usuario || "Equipe de Produtos" });
  };

  const handleGerar = async (registro) => {
    setGeneratingId(registro.id);
    const html = generateSignatureHTML(registro);
    const { error } = await sb.from("assinaturas").update({ html_assinatura: html, status: "enviada" }).eq("id", registro.id);
    setGeneratingId(null);
    if (error) {
      notify(`Erro ao gerar assinatura de ${registro.nome}`, "error");
      await registrarLog(`Falha ao gerar assinatura de ${registro.nome}: ${error.message}`, "erro");
    } else {
      notify(`Assinatura gerada para ${registro.nome}`);
      await registrarLog(`Assinatura gerada para ${registro.nome}`);
    }
    carregarDados();
  };

  const handleRegenerar = async (registro) => {
    setPreviewLoading(true);
    const html = generateSignatureHTML(registro);
    const { error } = await sb.from("assinaturas").update({ html_assinatura: html, status: "enviada" }).eq("id", registro.id);
    setPreviewLoading(false);
    if (error) {
      notify(`Erro ao regenerar assinatura de ${registro.nome}`, "error");
    } else {
      notify(`Assinatura de ${registro.nome} regenerada`);
      await registrarLog(`Assinatura regenerada para ${registro.nome}`);
    }
    carregarDados();
  };

  const handleEnviarRevisao = async (registro) => {
    const { error } = await sb.from("assinaturas").update({ status: "aguardando_aprovacao" }).eq("id", registro.id);
    if (!error) {
      notify(`Assinatura de ${registro.nome} enviada para revisão`);
      await registrarLog(`Assinatura de ${registro.nome} enviada para revisão`);
    }
    setPreviewColab(null);
    carregarDados();
  };

  const handleAdvance = async (registro) => { await handleGerar(registro); };

  const handleReprovar = async (registro) => {
    const { error } = await sb.from("assinaturas").update({ status: "pendente" }).eq("id", registro.id);
    if (!error) {
      notify(`Assinatura de ${registro.nome} reprovada — devolvida para nova geração`);
      await registrarLog(`Assinatura de ${registro.nome} reprovada, devolvida para nova geração`, "erro");
    }
    carregarDados();
  };

  const handleBaixar = async (registro, opts) => {
    try {
      await baixarAssinaturaPNG(registro, opts || {});
      notify(`Assinatura de ${registro.nome} baixada`);
    } catch (e) {
      notify("Não foi possível gerar o PNG", "error");
    }
  };

  const handleSaveEdit = async (updated) => {
    const { error } = await sb.from("assinaturas").update({ nome: updated.nome, cargo: updated.cargo, telefone: updated.telefone }).eq("id", updated.id);
    if (!error) notify(`Dados de ${updated.nome} atualizados`);
    setEditColab(null);
    carregarDados();
  };

  const previewAssinatura = previewColab && previewColab.htmlAssinatura ? previewColab : null;
  const evolucaoDiaria = calcularEvolucaoDiaria(registros);
  const historico = historicoFromLogs(logs);
  const [title, subtitle] = PAGE_TITLES[page];

  return (
    <div className={`min-h-screen flex ${t.bg}`}>
      <ToastView toast={toast} />
      <Sidebar page={page} setPage={setPage} sidebarOpen={sidebarOpen} setSidebarOpen={setSidebarOpen} revisaoCount={0} />
      <div className="flex-1 min-w-0 flex flex-col">
        <Topbar title={title} subtitle={subtitle} t={t} darkMode={darkMode} setDarkMode={setDarkMode} setSidebarOpen={setSidebarOpen} usuario={usuario} onSair={onSair} />
        <main className="flex-1 overflow-y-auto">
          {carregandoDados ? (
            <div className={`flex items-center justify-center gap-2 py-20 ${t.subtext}`}>
              <Icon name="loader-2" size={18} className="animate-spin" /> Carregando assinaturas...
            </div>
          ) : (
            <>
              {page === "dashboard" && <DashboardPage t={t} darkMode={darkMode} assinaturas={registros} evolucaoDiaria={evolucaoDiaria} />}
              {page === "colaboradores" && (
                <ColaboradoresPage t={t} darkMode={darkMode} colaboradores={registros} search={search} setSearch={setSearch} onGerar={handleGerar} generatingId={generatingId} onView={setPreviewColab} onEdit={setEditColab} />
              )}
              {page === "assinaturas" && (
                <AssinaturasPage t={t} darkMode={darkMode} assinaturas={registros} onView={setPreviewColab} onAdvance={handleAdvance} onBaixar={handleBaixar} />
              )}
              {page === "templates" && <TemplatesPage t={t} onSave={notify} />}
              {page === "historico" && <HistoricoPage t={t} historico={historico} />}
              {page === "logs" && <LogsPage t={t} logs={logs} />}
            </>
          )}
        </main>
      </div>

      {previewColab && (
        <PreviewModal
          colaborador={previewColab}
          assinatura={previewAssinatura}
          onClose={() => setPreviewColab(null)}
          onRegenerar={handleRegenerar}
          onEnviarRevisao={handleEnviarRevisao}
          onGerar={handleGerar}
          onBaixar={handleBaixar}
          onFotoAlterada={(id, url) => { setPreviewColab((p) => (p && p.id === id ? { ...p, foto: url } : p)); carregarDados(); }}
          loading={previewLoading}
          t={t}
        />
      )}

      {editColab && <EditColaboradorModal colaborador={editColab} onClose={() => setEditColab(null)} onSave={handleSaveEdit} t={t} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
