<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Raleway:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --page:#EFEADD;
    --surface:#FFFFFF;
    --surface-sunken:#E6E0CF;
    --line:#DDD6C3;
    --line-strong:#C9C0A8;
    --ink:#033838;
    --muted:#4d6461;
    --faint:#8a9692;

    --brand-green:#09533e;
    --brand-green-dark:#033838;
    --brand-lime:#A3C642;
    --brand-lime-dark:#5C8A22;

    --forest:#09533e;
    --forest-dark:#033838;
    --forest-dim:#DDEBDD;
    --gold:#A3C642;
    --gold-dark:#5C8A22;
    --gold-dim:#EDF2D8;
    --steel:#2E6B8A;
    --steel-dark:#1B4257;
    --steel-dim:#E1EDF3;
    --purple:#6B5195;
    --purple-dark:#3E2E5A;
    --purple-dim:#EBE6F2;
    --slate:#6E7D73;
    --slate-dim:#E6EDE8;
    --brick:#B5432B;
    --brick-dim:#F7E3DD;

    --font-display:'Roboto',system-ui,sans-serif;
    --font-body:'Raleway',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--page);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100vh;
    padding:0 0 80px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--gold-dim);color:var(--gold-dark);}
  main{ max-width:1180px; margin:0 auto; padding:0 28px; }

  /* ---------- Top bar ---------- */
  .topbar-wrap{ background:var(--brand-green); background-image:linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-dark) 100%); padding:18px 0; margin-bottom:24px; }
  .topbar{ max-width:1180px; margin:0 auto; padding:0 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  .brand-mark{ height:32px; width:auto; flex-shrink:0; }
  .brand-subtitle{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--brand-lime); }
  .topbar-right{ display:flex; align-items:center; gap:16px; }

  .lock-btn{
    font-family:var(--font-mono); font-size:12px; font-weight:500;
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.28); color:#EAF3ED;
    padding:9px 16px; border-radius:99px; cursor:pointer; transition:.15s;
    display:flex; align-items:center; gap:6px;
  }
  .lock-btn:hover{ border-color:var(--brand-lime); color:var(--brand-lime); }
  .lock-btn.unlocked{ background:var(--brand-lime); border-color:var(--brand-lime); color:var(--brand-green-dark); font-weight:700; }
  .lock-btn.unlocked:hover{ background:#9ED456; }

  /* ---------- Tabs ---------- */
  .tab-bar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .tab{
    display:flex; align-items:center; gap:8px;
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);
    font-family:var(--font-body); font-size:13.5px; font-weight:600;
    padding:9px 16px 9px 12px; border-radius:99px; cursor:pointer; transition:.15s;
  }
  .tab .tab-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .tab:hover{ border-color:var(--line-strong); box-shadow:0 1px 4px rgba(15,92,58,0.1); }
  .tab.active{ color:var(--brand-green-dark); border-color:transparent; background:var(--brand-lime) !important; font-weight:700; }
  .tab.active .tab-dot{ background:var(--brand-green-dark) !important; }

  /* ---------- Hero ---------- */
  .hero{
    border-radius:16px; padding:26px 30px; margin-bottom:18px;
    display:flex; align-items:center; gap:20px; color:#fff;
    position:relative; overflow:hidden;
  }
  .hero-icon{
    width:52px; height:52px; border-radius:14px; background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;
  }
  .hero-text{ flex:1; min-width:200px; }
  .hero-title{ font-family:var(--font-display); font-weight:700; font-size:clamp(20px,2.6vw,27px); letter-spacing:.01em; text-transform:uppercase; }
  .hero-sub{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; opacity:.82; margin-top:5px; }
  .hero-date{ text-align:right; flex-shrink:0; }
  .hero-date-label{ font-family:var(--font-mono); font-size:10.5px; opacity:.75; text-transform:uppercase; letter-spacing:.05em; }
  .hero-date-value{ font-family:var(--font-mono); font-size:15px; font-weight:600; margin-top:3px; }

  /* ---------- Stats ---------- */
  .stat-row{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-bottom:32px; }
  .stat{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; gap:14px;
  }
  .stat-badge{
    width:46px; height:46px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:13px; font-weight:600; color:#fff;
  }
  .stat .n{ font-family:var(--font-display); font-size:22px; font-weight:600; line-height:1; }
  .stat .l{ font-size:11px; color:var(--muted); margin-top:4px; text-transform:uppercase; letter-spacing:.04em; }
  @media (max-width:760px){ .stat-row{ grid-template-columns:repeat(2,1fr); } }

  /* ---------- Section head ---------- */
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap; }
  .section-head p{ font-size:13px; color:var(--muted); }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; }

  /* ---------- Card ---------- */
  .card{ position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:22px 20px 20px; box-shadow:0 1px 2px rgba(34,32,58,0.04); transition:box-shadow .15s ease, border-color .15s ease; }
  .card::before{ content:''; position:absolute; top:0; left:0; right:0; height:4px; background:var(--card-accent, var(--slate)); }
  .card:hover{ box-shadow:0 6px 18px rgba(34,32,58,0.09); }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-top:2px; }
  .card-name{ font-family:var(--font-display); font-size:18px; font-weight:600; line-height:1.3; }
  .card-name .arrow{ color:var(--faint); font-weight:400; margin:0 5px; font-family:var(--font-body); }
  .card-name .renamed{ color:var(--forest); }

  .status-pill, .status-badge{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; text-transform:uppercase;
    padding:5px 10px; border-radius:99px; border:none; white-space:nowrap; font-weight:600;
  }
  .status-pill{ cursor:pointer; appearance:none; -webkit-appearance:none; }
  .status-badge{ display:inline-block; }

  .desc{ font-size:13.5px; color:var(--muted); line-height:1.6; margin-top:12px; min-height:18px; outline:none; border-radius:4px; padding:2px 4px; margin-left:-4px; }
  .desc[contenteditable=true]{ cursor:text; }
  .desc[contenteditable=true]:hover, .desc[contenteditable=true]:focus{ background:var(--surface-sunken); color:var(--ink); }
  .desc.placeholder{ color:var(--faint); font-style:italic; }

  .divider{ height:1px; background:var(--line); margin:16px 0 12px; }

  .updates-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .updates-label{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .add-btn{ background:none; border:1px solid var(--line-strong); color:var(--muted); font-size:12px; font-weight:500; padding:4px 10px; border-radius:6px; cursor:pointer; transition:.15s; }
  .add-btn:hover{ border-color:var(--forest); color:var(--forest); }

  .timeline{ display:flex; flex-direction:column; gap:10px; }
  .update-item{ display:flex; gap:10px; font-size:13px; }
  .update-item .date{ font-family:var(--font-mono); font-size:11px; color:var(--faint); white-space:nowrap; padding-top:2px; min-width:60px; }
  .update-item .txt{ color:var(--ink); line-height:1.5; flex:1; outline:none; border-radius:4px; padding:1px 4px; margin-left:-4px; }
  .update-item .txt[contenteditable=true]{ cursor:text; }
  .update-item .txt[contenteditable=true]:hover, .update-item .txt[contenteditable=true]:focus{ background:var(--surface-sunken); }
  .update-item .del{ background:none; border:none; color:var(--faint); cursor:pointer; font-size:14px; line-height:1; padding:2px; opacity:0; transition:.15s; }
  .update-item:hover .del{ opacity:1; }
  .update-item .del:hover{ color:var(--brick); }
  .empty-updates{ font-size:12.5px; color:var(--faint); font-style:italic; }

  .add-form{ display:none; margin-top:10px; gap:8px; flex-direction:column; }
  .add-form.open{ display:flex; }
  .add-form input[type=date], .add-form input[type=text]{ background:var(--surface-sunken); border:1px solid var(--line); color:var(--ink); font-family:var(--font-mono); font-size:12px; padding:6px 8px; border-radius:6px; width:150px; }
  .add-form textarea{ background:var(--surface-sunken); border:1px solid var(--line); color:var(--ink); font-family:var(--font-body); font-size:13px; padding:8px 10px; border-radius:6px; resize:vertical; min-height:52px; }
  .add-form .row{ display:flex; gap:8px; }
  .save-btn{ background:var(--forest); color:#fff; border:none; font-weight:600; font-size:12.5px; padding:8px 16px; border-radius:8px; cursor:pointer; }
  .save-btn:hover{ background:var(--forest-dark); }
  .cancel-btn{ background:none; color:var(--muted); border:1px solid var(--line-strong); font-size:12.5px; padding:8px 14px; border-radius:8px; cursor:pointer; }

  .lab-grid .card{ border-style:dashed; }

  .card-actions{ display:flex; align-items:center; gap:6px; }
  .icon-btn{ background:none; border:1px solid var(--line-strong); color:var(--faint); width:26px; height:26px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; align-items:center; justify-content:center; transition:.15s; flex-shrink:0; }
  .icon-btn:hover{ border-color:var(--brick); color:var(--brick); }
  .icon-btn.confirming{ background:var(--brick-dim); border-color:var(--brick); color:var(--brick); width:auto; padding:0 10px; font-family:var(--font-mono); font-size:11px; }

  .ghost-card{ background:none; border:1.5px dashed var(--line-strong); border-radius:12px; display:flex; align-items:center; justify-content:center; min-height:80px; padding:20px; transition:.15s; cursor:pointer; }
  .ghost-card:hover{ border-color:var(--forest); background:var(--forest-dim); }
  .ghost-card .plus-label{ color:var(--muted); font-family:var(--font-mono); font-size:13px; display:flex; align-items:center; gap:8px; }
  .ghost-card:hover .plus-label{ color:var(--forest); }
  .ghost-card.open{ cursor:default; border-style:solid; background:var(--surface); box-shadow:0 1px 2px rgba(34,32,58,0.04); }
  .ghost-card.open:hover{ border-color:var(--line-strong); background:var(--surface); }

  .new-product-form{ display:none; width:100%; flex-direction:column; gap:8px; text-align:left; }
  .new-product-form.open{ display:flex; }
  .new-product-form input[type=text], .new-product-form select, .new-product-form textarea{ background:var(--surface-sunken); border:1px solid var(--line); color:var(--ink); font-family:var(--font-body); font-size:13px; padding:8px 10px; border-radius:6px; width:100%; }
  .new-product-form textarea{ resize:vertical; min-height:48px; }
  .new-product-form label{ font-family:var(--font-mono); font-size:10.5px; color:var(--faint); text-transform:uppercase; letter-spacing:.05em; margin-bottom:-4px; }

  /* ---------- Próximos passos ---------- */
  .passos-panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 24px; }

  /* ---------- Ações do relatório ---------- */
  .report-actions{ display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:28px; }
  @media (max-width:760px){ .report-actions{ grid-template-columns:1fr; } }
  .report-action-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .report-action-icon{ width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; }
  .report-action-title{ font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:4px; }
  .report-action-desc{ font-size:12px; color:var(--muted); line-height:1.5; }
  .report-action-card .save-btn{ align-self:flex-start; }
  .passo-row{ display:flex; align-items:center; gap:14px; padding:16px 0; border-bottom:1px solid var(--line); }
  .passo-row:last-child{ border-bottom:none; }
  .passo-badge{ width:30px; height:30px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; font-weight:600; }
  .passo-text{ flex:1; font-size:14.5px; outline:none; border-radius:4px; padding:2px 4px; margin-left:-4px; }
  .passo-text[contenteditable=true]{ cursor:text; }
  .passo-text[contenteditable=true]:hover, .passo-text[contenteditable=true]:focus{ background:var(--surface-sunken); }
  .passo-prazo{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); white-space:nowrap; }
  .passo-status-select{ font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; border:1px solid var(--line-strong); border-radius:6px; padding:4px 6px; background:var(--surface-sunken); color:var(--ink); }
  .new-passo-row{ display:flex; gap:8px; align-items:center; padding:16px 0; }
  .new-passo-row input[type=text]{ flex:1; background:var(--surface-sunken); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font-family:var(--font-body); font-size:13.5px; color:var(--ink); }
  .new-passo-row input[type=text].prazo-input{ flex:0 0 130px; }
  .empty-passos{ padding:20px 0; color:var(--faint); font-style:italic; font-size:13.5px; }

  /* ---------- Monday kanban ---------- */
  .monday-sync-note{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted); margin-bottom:16px; }
  .monday-sync-note a{ color:var(--steel); }
  .monday-kanban{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
  @media (max-width:820px){ .monday-kanban{ grid-template-columns:1fr; } }
  .monday-col{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .monday-col-head{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:13.5px; margin-bottom:14px; }
  .monday-col-dot{ width:8px; height:8px; border-radius:50%; }
  .monday-col-count{ margin-left:auto; font-family:var(--font-mono); font-size:11.5px; color:var(--faint); }
  .monday-col-body{ display:flex; flex-direction:column; gap:8px; }
  .monday-card{ display:flex; flex-direction:column; gap:6px; background:var(--surface-sunken); border:1px solid var(--line); border-radius:8px; padding:10px 12px; text-decoration:none; transition:.15s; }
  .monday-card:hover{ border-color:var(--line-strong); box-shadow:0 2px 8px rgba(34,32,58,0.06); }
  .monday-card-tags{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .monday-tag{ align-self:flex-start; font-family:var(--font-mono); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; padding:2px 8px; border-radius:99px; }
  .monday-pts{ font-family:var(--font-mono); font-size:10px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line-strong); padding:2px 7px; border-radius:99px; }
  .monday-title{ font-size:13px; color:var(--ink); line-height:1.4; }

  .sprint-banner{
    display:flex; align-items:center; justify-content:space-between; background:var(--brand-green);
    background-image:linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-dark) 100%);
    border-radius:14px; padding:18px 24px; margin-bottom:20px; color:#fff;
  }
  .sprint-banner-label{ font-family:var(--font-display); font-size:15px; font-weight:600; }
  .sprint-banner-sub{ font-family:var(--font-mono); font-size:11px; color:var(--brand-lime); margin-top:3px; }
  .sprint-banner-pts{ font-family:var(--font-display); font-size:26px; font-weight:700; display:flex; align-items:baseline; gap:5px; }
  .sprint-banner-pts span{ font-family:var(--font-mono); font-size:11px; font-weight:400; color:var(--brand-lime); text-transform:uppercase; }

  footer{ max-width:1180px; margin:40px auto 0; padding:20px 28px 0; border-top:1px solid var(--line); color:var(--faint); font-size:12px; font-family:var(--font-mono); }
  .loading-screen{ min-height:50vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-family:var(--font-mono); font-size:13px; }

  /* ---------- Gráficos ---------- */
  .chart-panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:24px; }
  .chart-title{ font-family:var(--font-mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:16px; }
  .chart-donut-wrap{ display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .chart-legend{ display:flex; flex-direction:column; gap:8px; flex:1; min-width:180px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink); }
  .legend-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .legend-n{ margin-left:auto; font-family:var(--font-mono); font-size:12px; color:var(--muted); }
  .chart-bars{ display:flex; flex-direction:column; gap:12px; }
  .bar-row{ display:flex; align-items:center; gap:12px; }
  .bar-label{ font-size:12.5px; color:var(--muted); width:150px; flex-shrink:0; }
  .bar-track{ flex:1; height:10px; background:var(--surface-sunken); border-radius:99px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:99px; transition:width .3s ease; }
  .bar-value{ font-family:var(--font-mono); font-size:12px; color:var(--ink); width:22px; text-align:right; flex-shrink:0; }


  /* ---------- Lock modal ---------- */
  .lock-overlay{ display:none; position:fixed; inset:0; background:rgba(34,32,58,0.5); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .lock-overlay.open{ display:flex; }
  .lock-box{ background:var(--surface); border-radius:16px; padding:28px; width:100%; max-width:340px; box-shadow:0 20px 50px rgba(0,0,0,0.25); }
  .lock-title{ font-family:var(--font-display); font-size:19px; font-weight:600; margin-bottom:6px; }
  .lock-hint{ font-size:12.5px; color:var(--muted); margin-bottom:16px; line-height:1.5; }
  .lock-box input[type=password]{ width:100%; background:var(--surface-sunken); border:1px solid var(--line-strong); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:8px; }
  .lock-error{ color:var(--brick); font-size:12px; margin-bottom:10px; }
  /* ---------- Relatório completo (impressão / PDF) ---------- */
  #printArea{ display:none; }
  @media print{
    @page{ margin:14mm; }
    *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; }
  }
  .rp-cover{
    background:var(--brand-green); background-image:linear-gradient(135deg, var(--brand-green) 0%, var(--brand-green-dark) 100%);
    color:#fff; padding:26px 30px; border-radius:10px; margin-bottom:22px;
  }
  .rp-logo{ height:28px; margin-bottom:16px; }
  .rp-cover h1{ font-family:var(--font-display); font-size:24px; font-weight:700; }
  .rp-sub{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:1px; color:var(--brand-lime); margin-top:6px; }
  .rp-meta{ font-size:11px; color:#DCEEE2; margin-top:10px; }
  .rp-h2{ font-family:var(--font-display); font-size:16px; color:var(--forest); margin:22px 0 10px; border-bottom:2px solid var(--line); padding-bottom:6px; }
  .rp-stats{ display:flex; gap:10px; margin-bottom:16px; }
  .rp-stat{ flex:1; background:var(--surface); border:1px solid var(--line); padding:10px 12px; border-radius:8px; }
  .rp-stat-n{ font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--forest); }
  .rp-stat-l{ font-size:9.5px; color:var(--muted); text-transform:uppercase; }
  .rp-chart-row{ display:flex; gap:14px; margin-bottom:6px; }
  .rp-chart-row .chart-panel{ flex:1; }
  .rp-grid{ display:flex; flex-wrap:wrap; gap:12px; }
  .rp-card{ width:calc(50% - 6px); background:var(--surface); border:1px solid var(--line); border-top:3px solid; border-radius:8px; padding:12px 14px; page-break-inside:avoid; }
  .rp-card-name{ font-family:var(--font-display); font-size:14px; font-weight:700; }
  .rp-arrow{ color:var(--faint); font-weight:400; }
  .rp-renamed{ color:var(--forest); }
  .rp-desc{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .rp-updates{ margin-top:8px; border-top:1px solid var(--line); padding-top:6px; }
  .rp-upd{ font-size:10.5px; margin-bottom:3px; }
  .rp-upd-date{ font-family:var(--font-mono); color:var(--faint); margin-right:6px; }
  .rp-upd-empty{ font-size:10.5px; color:var(--faint); font-style:italic; }
  .rp-passo{ font-size:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .rp-passo:last-child{ border-bottom:none; }
  .rp-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:8px; }
  .rp-date{ float:right; font-family:var(--font-mono); font-size:10px; color:var(--muted); }
  .rp-mon-groups{ display:flex; flex-direction:column; gap:14px; }
  .rp-mon-group{ border-left:3px solid; padding-left:14px; page-break-inside:avoid; }
  .rp-mon-group-head{ font-family:var(--font-display); font-size:13px; font-weight:700; margin-bottom:6px; }
  .rp-mon-group-count{ font-family:var(--font-mono); font-size:10.5px; color:var(--faint); font-weight:400; }
  .rp-mon-table2{ width:100%; border-collapse:collapse; }
  .rp-mon-table2 tr{ border-bottom:1px solid var(--line); }
  .rp-mon-table2 tr:last-child{ border-bottom:none; }
  .rp-mon-td-status{ padding:6px 10px 6px 0; white-space:nowrap; width:110px; vertical-align:top; }
  .rp-mon-status-tag{ display:inline-block; font-family:var(--font-mono); font-size:8.5px; text-transform:uppercase; letter-spacing:.03em; padding:3px 8px; border-radius:20px; font-weight:700; }
  .rp-mon-td-title{ padding:6px 0; font-size:11px; line-height:1.4; }
  .rp-footer{ margin-top:24px; padding-top:10px; border-top:1px solid var(--line); font-family:var(--font-mono); font-size:9px; color:var(--faint); }
</style>
</head>

function statusOptionsHTML(current){
  return STATUS_ORDER.map(s => `<option value="${s}" ${s===current?'selected':''}>${s}</option>`).join('');
}
function formatDate(iso){
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y.slice(2)}`;
}
function todayFmt(){
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST',
      headers:{ apikey: SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if(!res.ok) return false;
    session = await res.json();
    return true;
  }catch(e){ return false; }
}

async function sbFetch(path, options={}, isRetry){
  const authToken = session ? session.access_token : SUPABASE_KEY;
  const headers = { apikey: SUPABASE_KEY, 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json', ...(options.headers||{}) };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...options, headers });
  if(res.status === 401 && session && !isRetry){
    const refreshed = await refreshSession();
    if(refreshed) return sbFetch(path, options, true);
    session = null; editMode = false; updateLockButton(); renderAll();
    openLockModal('Sua sessão expirou. Faça login de novo pra continuar editando — o que você tentou salvar não foi perdido, é só tentar de novo depois de entrar.');
    throw new Error('Sessão expirada — faça login novamente.');
  }
  if(!res.ok){ const errText = await res.text().catch(()=> ''); throw new Error(`Supabase ${res.status}: ${errText}`); }
  return res.status === 204 ? null : res.json();
}

async function loadAll(){
  const desde = new Date(Date.now() - RELATORIO_DIAS*24*60*60*1000).toISOString();
  const [products, updates, passosData, mondayData, historicoData] = await Promise.all([
    sbFetch('produtos_portfolio?select=*&order=section.asc,ordem.asc'),
    sbFetch('produtos_atualizacoes?select=*&order=update_date.asc'),
    sbFetch('proximos_passos?select=*&order=ordem.asc'),
    sbFetch('monday_atividades?select=*&order=sincronizado_em.desc'),
    sbFetch(`status_historico?select=*&alterado_em=gte.${desde}&order=alterado_em.desc`),
  ]);
  state = {}; sectionOrder = { portfolio: [], lab: [] };
  for(const p of products){
    state[p.slug] = { name:p.name, renamedTo:p.renamed_to, section:p.section, status:p.status, desc:p.description||'', updates:[] };
    sectionOrder[p.section].push(p.slug);
  }
  for(const u of updates){
    if(state[u.product_slug]) state[u.product_slug].updates.push({ id:u.id, date:u.update_date, text:u.texto });
  }
  passos = passosData.map(p=>({ id:p.id, texto:p.texto, status:p.status, prazo:p.prazo }));
  mondayItems = mondayData.map(m=>({ id:m.id, titulo:m.titulo, projeto:m.projeto, grupo:m.grupo, url:m.url, sync:m.sincronizado_em, statusGranular:m.status_granular, prioridade:m.prioridade, storyPoints:m.story_points, sprint:m.sprint }));
  statusHistorico = historicoData.map(h=>({ produto:h.produto_nome, de:h.status_anterior, para:h.status_novo, em:h.alterado_em }));
}

}

}

/* ---------- Stats ---------- */
function relatorioCutoff(){
  const d = new Date(Date.now() - RELATORIO_DIAS*24*60*60*1000);
  return d.toISOString().slice(0,10);
}
function getRelatorioUpdates(){
  const cutoff = relatorioCutoff();
  const rows = [];
  for(const slug in state){
    for(const u of state[slug].updates){
      if(u.date >= cutoff) rows.push({ produto: state[slug].name, date: u.date, text: u.text });
    }
  }
  rows.sort((a,b)=> b.date.localeCompare(a.date));
  return rows;
}

  } else {

/* ---------- Gráficos ---------- */
function donutChartHTML(segments, size){
  size = size || 128;
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = size/2 - 14;
  const c = size/2;
  const circumference = 2*Math.PI*r;
  let cumulative = 0;
  const arcs = total ? segments.filter(s=>s.value>0).map(seg=>{
    const frac = seg.value/total;
    const dash = frac*circumference;
    const rotation = (cumulative/total)*360 - 90;
    cumulative += seg.value;
    return `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="18" stroke-dasharray="${dash} ${circumference-dash}" transform="rotate(${rotation} ${c} ${c})" stroke-linecap="butt"/>`;
  }).join('') : `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-width="18"/>`;
  return `
  <div class="chart-donut-wrap">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      ${arcs}
      <text x="${c}" y="${c-3}" text-anchor="middle" font-family="var(--font-display)" font-size="22" font-weight="600" fill="var(--ink)">${total}</text>
      <text x="${c}" y="${c+14}" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="var(--faint)">TOTAL</text>
    </svg>
    <div class="chart-legend">
      ${segments.map(s=>`<div class="legend-item"><span class="legend-dot" style="background:${s.color};"></span>${s.label}<span class="legend-n">${s.value}</span></div>`).join('')}
    </div>
  </div>`;
}

function barChartHTML(segments){
  const max = Math.max(...segments.map(s=>s.value), 1);
  return `<div class="chart-bars">
    ${segments.map(s=>`
      <div class="bar-row">
        <div class="bar-label">${escapeHTML(s.label)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(s.value/max*100).toFixed(1)}%;background:${s.color};"></div></div>
        <div class="bar-value">${s.value}</div>
      </div>`).join('')}
  </div>`;
}

function chartPanelHTML(title, inner){
  return `<div class="chart-panel"><div class="chart-title">${title}</div>${inner}</div>`;
}

function renderMonday(){
  if(!mondayItems.length){
    return `<div class="passos-panel"><div class="empty-passos">Nenhuma atividade sincronizada ainda.</div></div>`;
  }
  const lastSync = mondayItems.reduce((max,m)=> m.sync>max?m.sync:max, mondayItems[0].sync);
  const syncDate = new Date(lastSync);
  const syncFmt = `${String(syncDate.getDate()).padStart(2,'0')}/${String(syncDate.getMonth()+1).padStart(2,'0')} às ${String(syncDate.getHours()).padStart(2,'0')}:${String(syncDate.getMinutes()).padStart(2,'0')}`;
  const sprintAtualItems = mondayItems.filter(m=>m.grupo==='🏃 Sprint Atual');
  const sprintPts = sprintAtualItems.reduce((sum,m)=> sum + (m.storyPoints||0), 0);
  const sprintLabel = sprintAtualItems.find(m=>m.sprint)?.sprint;
  const cols = GRUPO_ORDER.map(g=>{
    const items = mondayItems.filter(m=>m.grupo===g);
    return `<div class="monday-col">
      <div class="monday-col-head" style="color:${GRUPO_COLOR[g]};">
        <span class="monday-col-dot" style="background:${GRUPO_COLOR[g]};"></span>${g}
        <span class="monday-col-count">${items.length}</span>
      </div>
      <div class="monday-col-body">
        ${items.length ? items.map(mondayCardHTML).join('') : '<div class="empty-passos">Vazio</div>'}
      </div>
    </div>`;
  }).join('');
  const porProjeto = Object.keys(PROJETO_COLORS).map(proj=>({
    label:proj, value:mondayItems.filter(m=>m.projeto===proj).length, color:PROJETO_COLORS[proj].c,
  })).filter(p=>p.value>0);
  const bars = barChartHTML(porProjeto);
  return `
    <div class="sprint-banner">
      <div><div class="sprint-banner-label">Sprint atual${sprintLabel?` — ${escapeHTML(sprintLabel)}`:''}</div>
      <div class="sprint-banner-sub">${sprintAtualItems.length} atividade${sprintAtualItems.length===1?'':'s'} em andamento</div></div>

/* ---------- Relatório para diretoria ---------- */
function buildRelatorioText(){
  const cutoff = relatorioCutoff();
  const hojeFmt = todayFmt();
  const cutoffFmt = formatDate(cutoff);
  const upd = getRelatorioUpdates();
  let txt = `RELATÓRIO QUINZENAL — PAINEL DE PRODUTOS (M&F)\nPeríodo: ${cutoffFmt} a ${hojeFmt}\n\n`;
  txt += `MUDANÇAS DE STATUS\n`;
  txt += statusHistorico.length
    ? statusHistorico.map(h=>`• ${h.produto} (${formatDate(h.em.slice(0,10))}): ${h.de||'—'} → ${h.para}`).join('\n')
    : 'Nenhuma mudança de status registrada nesse período.';
  txt += `\n\nATUALIZAÇÕES REGISTRADAS\n`;
  txt += upd.length
    ? upd.map(u=>`• ${u.produto} (${formatDate(u.date)}): ${u.text}`).join('\n')
    : 'Nenhuma atualização registrada nesse período.';
  return txt;
}

function relatorioRowsHTML(){
  const upd = getRelatorioUpdates();
  const statusRows = statusHistorico.length
    ? statusHistorico.map(h=>`<div class="passo-row">
        <div class="passo-badge" style="background:var(--forest);">↝</div>
        <div class="passo-text"><b>${escapeHTML(h.produto)}</b> — ${escapeHTML(h.de||'—')} → <b style="color:var(--forest);">${escapeHTML(h.para)}</b></div>
        <div class="passo-prazo">${formatDate(h.em.slice(0,10))}</div>
      </div>`).join('')
    : `<div class="empty-passos">Nenhuma mudança de status registrada nesse período.</div>`;
  const updRows = upd.length
    ? upd.map(u=>`<div class="passo-row">
        <div class="passo-badge" style="background:var(--steel);">✎</div>
        <div class="passo-text"><b>${escapeHTML(u.produto)}</b> — ${escapeHTML(u.text)}</div>
        <div class="passo-prazo">${formatDate(u.date)}</div>
      </div>`).join('')
    : `<div class="empty-passos">Nenhuma atualização registrada nesse período.</div>`;
  return { statusRows, updRows };
}

const MONDAY_REPORT_PROJETOS = ['Oficina', 'MIRA', 'IACOB', 'Benchmark', 'Produtos'];

function rpProductCard(p){
  const st = STATUS[p.status] || STATUS['Em planejamento'];
  const name = p.renamedTo ? `${escapeHTML(p.name)} <span class="rp-arrow">→</span> <span class="rp-renamed">${escapeHTML(p.renamedTo)}</span>` : escapeHTML(p.name);
  const desc = p.desc ? escapeHTML(p.desc) : '<i>Sem descrição registrada.</i>';
  const ups = p.updates.slice().sort((a,b)=> b.date.localeCompare(a.date));
  const upsHtml = ups.length
    ? ups.map(u=>`<div class="rp-upd"><span class="rp-upd-date">${formatDate(u.date)}</span> ${escapeHTML(u.text)}</div>`).join('')
    : '<div class="rp-upd-empty">Nenhuma atualização registrada.</div>';
  return `<div class="rp-card" style="border-top-color:${st.color};">
    <div class="rp-card-name">${name}</div>
    <div class="status-badge" style="background:${st.dim};color:${st.color};">${p.status}</div>
    <div class="rp-desc">${desc}</div>
    <div class="rp-updates">${upsHtml}</div>
  </div>`;
}

function buildFullReportHTML(){
  const logoSrc = document.querySelector('.brand-mark')?.src || '';
  const portfolioItems = sectionOrder.portfolio.map(s=>state[s]);
  const labItems = sectionOrder.lab.map(s=>state[s]);

  const segsFor = (items) => [
    {label:'Ativo', value:items.filter(p=>p.status==='Ativo').length, color:'var(--forest)'},
    {label:'MVP/Piloto', value:items.filter(p=>['MVP','Piloto'].includes(p.status)).length, color:'var(--gold)'},
    {label:'Em desenvolvimento', value:items.filter(p=>p.status==='Em desenvolvimento').length, color:'var(--steel)'},
    {label:'Em planejamento', value:items.filter(p=>p.status==='Em planejamento').length, color:'var(--slate)'},
    {label:'Pausado', value:items.filter(p=>p.status==='Pausado').length, color:'var(--brick)'},
  ];

  const passoSegs = [
    { label:PASSO_STATUS.em_iniciacao.label, value:passos.filter(p=>p.status==='em_iniciacao').length, color:PASSO_STATUS.em_iniciacao.color },
    { label:PASSO_STATUS.em_execucao.label, value:passos.filter(p=>p.status==='em_execucao').length, color:PASSO_STATUS.em_execucao.color },
    { label:PASSO_STATUS.concluido.label, value:passos.filter(p=>p.status==='concluido').length, color:PASSO_STATUS.concluido.color },
  ];

  const mondayFiltered = mondayItems.filter(m=>MONDAY_REPORT_PROJETOS.includes(m.projeto));
  const mondaySegs = MONDAY_REPORT_PROJETOS.map(proj=>({
    label:proj, value:mondayFiltered.filter(m=>m.projeto===proj).length, color:(PROJETO_COLORS[proj]||{c:'var(--slate)'}).c,
  })).filter(s=>s.value>0);

  const GRUPO_ORDER_REPORT = ['🏃 Sprint Atual', '👀 Em Revisão', '📥 Backlog', '✅ Concluído'];
  const mondayTableRows = MONDAY_REPORT_PROJETOS
    .filter(proj => mondayFiltered.some(m=>m.projeto===proj))
    .map(proj=>{
      const pc = PROJETO_COLORS[proj] || { c:'var(--slate)', d:'var(--slate-dim)' };
      const items = mondayFiltered
        .filter(m=>m.projeto===proj)
        .sort((a,b)=> GRUPO_ORDER_REPORT.indexOf(a.grupo) - GRUPO_ORDER_REPORT.indexOf(b.grupo));
      const rows = items.map(m=>`
        <tr>
          <td class="rp-mon-td-status"><span class="rp-mon-status-tag" style="background:${GRUPO_COLOR[m.grupo]}22;color:${GRUPO_COLOR[m.grupo]};">${m.grupo}</span></td>
          <td class="rp-mon-td-title">${escapeHTML(m.titulo)}</td>
        </tr>`).join('');
      return `
      <div class="rp-mon-group" style="border-left-color:${pc.c};">
        <div class="rp-mon-group-head" style="color:${pc.c};">${escapeHTML(proj)} <span class="rp-mon-group-count">${items.length}</span></div>
        <table class="rp-mon-table2"><tbody>${rows}</tbody></table>
      </div>`;
    }).join('');

  const statusHistHtml = statusHistorico.length
    ? statusHistorico.map(h=>`<div class="rp-passo"><span class="rp-dot" style="background:var(--forest);"></span><b>${escapeHTML(h.produto)}</b> — ${escapeHTML(h.de||'—')} → <b style="color:var(--forest);">${escapeHTML(h.para)}</b><span class="rp-date">${formatDate(h.em.slice(0,10))}</span></div>`).join('')
    : '<div class="rp-upd-empty">Nenhuma mudança de status nos últimos 14 dias.</div>';

  const passosHtml = passos.length
    ? passos.map(p=>{
        const st = PASSO_STATUS[p.status];
        return `<div class="rp-passo"><span class="rp-dot" style="background:${st.color};"></span>${escapeHTML(p.texto)}${p.prazo?`<span class="rp-date">${escapeHTML(p.prazo)}</span>`:''}</div>`;
      }).join('')
    : '<div class="rp-upd-empty">Nenhum passo registrado.</div>';

  return `
    <div class="rp-cover">
      ${logoSrc?`<img src="${logoSrc}" class="rp-logo">`:''}
      <h1>Relatório de Produtos</h1>
      <div class="rp-sub">PORTFÓLIO · LABORATÓRIO · PRÓXIMOS PASSOS · MONDAY</div>
      <div class="rp-meta">Gerado em ${todayFmt()} · Painel de Produtos M&F</div>
    </div>
    <div class="rp-body">
      <h2 class="rp-h2">Visão Geral</h2>
      <div class="rp-stats">
        <div class="rp-stat"><div class="rp-stat-n">${portfolioItems.length + labItems.length}</div><div class="rp-stat-l">Produtos no total</div></div>
        <div class="rp-stat"><div class="rp-stat-n">${portfolioItems.length}</div><div class="rp-stat-l">No portfólio</div></div>
        <div class="rp-stat"><div class="rp-stat-n">${labItems.length}</div><div class="rp-stat-l">No laboratório</div></div>
        <div class="rp-stat"><div class="rp-stat-n">${passos.length}</div><div class="rp-stat-l">Próximos passos</div></div>
      </div>
      <div class="rp-chart-row">
        ${chartPanelHTML('Status — Portfólio', donutChartHTML(segsFor(portfolioItems)))}
        ${chartPanelHTML('Status — Laboratório', donutChartHTML(segsFor(labItems)))}
      </div>
      <div class="rp-chart-row">
        ${chartPanelHTML('Próximos passos por status', barChartHTML(passoSegs))}
        ${chartPanelHTML('Monday — itens por projeto', barChartHTML(mondaySegs))}
      </div>
      <h2 class="rp-h2">Mudanças de status (últimos 14 dias)</h2>
      <div class="passos-panel">${statusHistHtml}</div>
      <h2 class="rp-h2">Portfólio de Produtos</h2>
      <div class="rp-grid">${portfolioItems.map(rpProductCard).join('')}</div>
      <h2 class="rp-h2">Laboratório de Produtos</h2>
      <div class="rp-grid">${labItems.map(rpProductCard).join('')}</div>
      <h2 class="rp-h2">Próximos Passos</h2>
      <div class="passos-panel">${passosHtml}</div>
      <h2 class="rp-h2">Atividades no Monday</h2>
      <div class="rp-mon-groups">${mondayTableRows}</div>
      <div class="rp-footer">Relatório gerado a partir do Painel de Produtos M&F. Dados referentes a ${todayFmt()}.</div>
    </div>`;
}

window.printFullReport = function(){
  document.getElementById('printArea').innerHTML = buildFullReportHTML();
  window.print();
};

window.copyRelatorio = function(){
  const text = buildRelatorioText();
  const btn = document.getElementById('copyReportBtn');
  const done = ()=>{ if(btn){ const orig=btn.innerText; btn.innerText='✓ Copiado!'; setTimeout(()=>{ btn.innerText=orig; }, 1800); } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
};
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ console.error('copy failed', e); }
  document.body.removeChild(ta);
}

/* ---------- Render orchestration ---------- */
function renderAll(){
  renderTabBar();
  renderHero();
  renderStats();
  let body;
  if(activeTab === 'passos') body = renderPassos();
  else if(activeTab === 'monday') body = renderMonday();
  else if(activeTab === 'relatorio') body = renderRelatorio();
  else body = renderProductGrid();
  document.getElementById('bodyContent').innerHTML = body;
}

/* ---------- Lock / unlock ---------- */
window.openLockModal = function(message){
  document.getElementById('loginPassword').value = '';
  document.getElementById('lockError').style.display = 'none';
  document.getElementById('lockHint').innerText = message || 'A visualização continua livre para todo o time. Só quem tiver login consegue editar.';
  document.getElementById('lockOverlay').classList.add('open');
  setTimeout(()=>document.getElementById('loginPassword').focus(), 50);
};
window.handleLockClick = function(){
  if(session){ session = null; editMode = false; updateLockButton(); renderAll(); return; }
  openLockModal();
};
window.closeLockModal = function(){ document.getElementById('lockOverlay').classList.remove('open'); };
window.submitLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('lockError');
  errEl.style.display = 'none';
  try{
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{ apikey: SUPABASE_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ email, password }),
    });
    if(!res.ok) throw new Error('login failed');
    session = await res.json();
    editMode = true;
    closeLockModal(); updateLockButton(); renderAll();
  }catch(e){
    errEl.style.display = 'block';
  }
};
function updateLockButton(){
  const btn = document.getElementById('lockBtn');
  btn.classList.toggle('unlocked', !!session);
  btn.innerText = session ? `🔓 ${session.user.email.split('@')[0]} · Sair` : '🔒 Editar';
}

/* ---------- Product interactions ---------- */
window.changeStatus = async function(slug, value){
  const prev = state[slug].status; if(prev === value) return;
  state[slug].status = value; renderAll();
  try{
    await sbFetch(`produtos_portfolio?slug=eq.${slug}`, { method:'PATCH', body: JSON.stringify({ status:value, updated_at:new Date().toISOString() }) });
    await sbFetch('status_historico', { method:'POST', body: JSON.stringify({ product_slug:slug, produto_nome:state[slug].name, status_anterior:prev, status_novo:value }) });
  }catch(e){ state[slug].status = prev; renderAll(); showSyncError(e); }
};
window.clearPlaceholder = function(el){ if(el.classList.contains('placeholder')){ el.innerText=''; el.classList.remove('placeholder'); } };
window.saveDescription = async function(slug, el){
  const text = el.innerText.trim(); state[slug].desc = text;
  if(!text){ el.innerText = 'Clique para adicionar uma descrição…'; el.classList.add('placeholder'); }
  try{ await sbFetch(`produtos_portfolio?slug=eq.${slug}`, { method:'PATCH', body: JSON.stringify({ description:text, updated_at:new Date().toISOString() }) }); }
  catch(e){ showSyncError(e); }
};
window.toggleForm = function(slug){ document.getElementById(`form-${slug}`).classList.toggle('open'); };
window.addUpdate = async function(slug){
  const dateEl = document.getElementById(`date-${slug}`); const textEl = document.getElementById(`text-${slug}`);
  const text = textEl.value.trim(); if(!text) return;
  try{
    const rows = await sbFetch('produtos_atualizacoes', { method:'POST', headers:{'Prefer':'return=representation'}, body: JSON.stringify({ product_slug:slug, update_date:dateEl.value, texto:text }) });
    state[slug].updates.push({ id:rows[0].id, date:rows[0].update_date, text:rows[0].texto }); renderAll();
  }catch(e){ showSyncError(e); }
};
window.deleteUpdate = async function(slug, id){
  const backup = state[slug].updates.slice(); state[slug].updates = state[slug].updates.filter(u=>u.id!==id); renderAll();
  try{ await sbFetch(`produtos_atualizacoes?id=eq.${id}`, { method:'DELETE' }); }
  catch(e){ state[slug].updates = backup; renderAll(); showSyncError(e); }
};
window.saveUpdateText = async function(slug, id, el){
  const text = el.innerText.trim(); if(!text) return;
  const u = state[slug].updates.find(x=>x.id===id); if(u) u.text = text;
  try{ await sbFetch(`produtos_atualizacoes?id=eq.${id}`, { method:'PATCH', body: JSON.stringify({ texto:text }) }); }
  catch(e){ showSyncError(e); }
};
function slugify(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || `produto-${Date.now()}`;
}
window.toggleNewProductForm = function(section, ev){
  if(ev) ev.stopPropagation();
  const ghost = document.getElementById(`ghost-${section}`); const form = document.getElementById(`new-form-${section}`); const label = document.getElementById(`ghost-label-${section}`);
  const opening = !form.classList.contains('open');
  form.classList.toggle('open', opening); ghost.classList.toggle('open', opening); label.style.display = opening ? 'none' : 'flex';
};
window.saveNewProduct = async function(section, ev){
  if(ev) ev.stopPropagation();
  const name = document.getElementById(`new-name-${section}`).value.trim();
  const renamed = document.getElementById(`new-renamed-${section}`).value.trim();
  const status = document.getElementById(`new-status-${section}`).value;
  const desc = document.getElementById(`new-desc-${section}`).value.trim();
  if(!name) return;
  let slug = slugify(name); if(state[slug]) slug = `${slug}-${Date.now().toString().slice(-4)}`;
  const ordem = (sectionOrder[section]?.length || 0) + 1;
  try{
    await sbFetch('produtos_portfolio', { method:'POST', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({ slug, name, renamed_to: renamed||null, section, status, description: desc, ordem }) });
    state[slug] = { name, renamedTo: renamed||null, section, status, desc, updates: [] };
    sectionOrder[section].push(slug); renderAll();
  }catch(e){ showSyncError(e); }
};
window.deleteProduct = async function(slug){
  const btn = document.getElementById(`delbtn-${slug}`); if(!btn) return;
  if(!btn.classList.contains('confirming')){
    btn.classList.add('confirming'); btn.innerText = 'Excluir?';
    btn.onclick = (e)=>{ e.stopPropagation(); confirmDeleteProduct(slug); };
    setTimeout(()=>{ if(btn.classList.contains('confirming')){ btn.classList.remove('confirming'); btn.innerText='🗑'; btn.onclick=()=>window.deleteProduct(slug); } }, 3000);
  }
};
async function confirmDeleteProduct(slug){
  const backupState = state[slug]; const backupOrder = sectionOrder[backupState.section].slice();
  delete state[slug]; sectionOrder[backupState.section] = sectionOrder[backupState.section].filter(s=>s!==slug); renderAll();
  try{ await sbFetch(`produtos_portfolio?slug=eq.${slug}`, { method:'DELETE' }); }
  catch(e){ state[slug]=backupState; sectionOrder[backupState.section]=backupOrder; renderAll(); showSyncError(e); }
}

/* ---------- Próximos passos interactions ---------- */
window.addPasso = async function(){

window.deletePasso = async function(id){

window.savePassoText = async function(id, el){

window.savePassoStatus = async function(id, value){

})();
</script>
